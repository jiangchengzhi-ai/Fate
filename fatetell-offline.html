/* ---------------- 首页命盘 ---------------- */
const pt = (cx, cy, r, deg) => {
  const a = ((deg - 90) * Math.PI) / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
};

function arc(cx, cy, r1, r2, a0, a1) {
  const [x1, y1] = pt(cx, cy, r2, a0);
  const [x2, y2] = pt(cx, cy, r2, a1);
  const [x3, y3] = pt(cx, cy, r1, a1);
  const [x4, y4] = pt(cx, cy, r1, a0);
  const large = a1 - a0 > 180 ? 1 : 0;
  return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r2} ${r2} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L${x3.toFixed(2)} ${y3.toFixed(2)} A${r1} ${r1} 0 ${large} 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z`;
}

const MODULES = [
  { key: 'ming', title: '命', center: 0, href: '#/c/ming' },
  { key: 'bu', title: '卜', center: 72, href: '#/c/bu' },
  { key: 'xiang', title: '相', center: 144, href: '#/c/xiang' },
  { key: 'kan', title: '堪舆', center: 216, href: '#/c/kan' },
  { key: 'ze', title: '择日', center: 288, href: '#/c/ze' },
];

function dialSVG() {
  const C = 160;
  let ticks = '';
  for (let d = 0; d < 360; d += 5) {
    const major = d % 15 === 0;
    const r1 = 150;
    const r2 = major ? 158 : 154;
    const [x1, y1] = pt(C, C, r1, d);
    const [x2, y2] = pt(C, C, r2, d);
    ticks += `<line class="tick${major ? ' major' : ''}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke-width="${major ? 1 : 0.6}"/>`;
  }

  const guaGlyphs = ['☰', '☵', '☶', '☳', '☴', '☲', '☷', '☱'];
  let guas = '';
  guaGlyphs.forEach((g, i) => {
    const [x, y] = pt(C, C, 143, i * 45);
    guas += `<text class="gua" x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle">${g}</text>`;
  });

  let wedges = '';
  MODULES.forEach((m) => {
    const a0 = m.center - 32;
    const a1 = m.center + 32;
    const [tx, ty] = pt(C, C, 94, m.center);
    const chars = [...m.title];
    const n = chars.length;
    const fs = n > 1 ? 22 : 26;
    const step = n > 1 ? 26 : 30;
    const charTxt = chars.map((ch, i) => {
      const y = ty + (i - (n - 1) / 2) * step + fs * 0.35;
      return `<text class="wedge-t" style="font-size:${fs}px" x="${tx.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle">${esc(ch)}</text>`;
    }).join('');
    wedges += `
      <a class="wedge" href="${m.href}" xlink:href="${m.href}" aria-label="${esc(m.title)}">
        <path class="wedge-fill" d="${arc(C, C, 52, 132, a0, a1)}"/>
        ${charTxt}
      </a>`;
  });

  return `
  <svg class="dial dial-in" viewBox="0 0 320 320" xmlns:xlink="http://www.w3.org/1999/xlink" role="navigation" aria-label="五门命盘">
    <circle class="ring-faint" cx="160" cy="160" r="158"/>
    ${ticks}
    ${guas}
    <circle class="ring" cx="160" cy="160" r="136"/>
    ${wedges}
    <circle class="core" cx="160" cy="160" r="42"/>
    <text class="core-t" x="160" y="157" text-anchor="middle">命盘</text>
    <text class="core-s" x="160" y="175" text-anchor="middle">FATETELL</text>
  </svg>`;
}

/* ---------------- 雷达图 ---------------- */
function radarSVG(dims, opt = {}) {
  const size = opt.size || 260;
  const C = size / 2;
  const R = opt.radius || 82;
  const n = dims.length;
  const angle = (i) => (360 / n) * i;
  const p = (i, r) => pt(C, C, r, angle(i));

  let rings = '';
  [0.25, 0.5, 0.75, 1].forEach((k) => {
    const ps = Array.from({ length: n }, (_, i) => p(i, R * k).map((v) => v.toFixed(1)).join(','));
    rings += `<polygon class="grid" points="${ps.join(' ')}"/>`;
  });

  let axes = '';
  for (let i = 0; i < n; i++) {
    const [x, y] = p(i, R);
    axes += `<line class="axis" x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
  }

  const shape = dims.map((d, i) => {
    const r = (Math.max(42, Math.min(96, d.v)) - 40) / 56 * R * 0.92 + R * 0.08;
    return p(i, r).map((v) => v.toFixed(1)).join(',');
  });
  const dots = dims.map((d, i) => {
    const r = (Math.max(42, Math.min(96, d.v)) - 40) / 56 * R * 0.92 + R * 0.08;
    const [x, y] = p(i, r);
    return `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.9"/>`;
  }).join('');

  let labels = '';
  dims.forEach((d, i) => {
    const [x, y] = p(i, R + 20);
    const anchor = Math.abs(x - C) < 6 ? 'middle' : (x > C ? 'start' : 'end');
    labels += `<text class="lab" x="${x.toFixed(1)}" y="${(y + 3.5).toFixed(1)}" text-anchor="${anchor}">${esc(d.label)}</text>`;
    if (opt.showVal) {
      labels += `<text class="val" x="${x.toFixed(1)}" y="${(y + 14).toFixed(1)}" text-anchor="${anchor}">${d.v}</text>`;
    }
  });

  return `<svg class="radar" viewBox="0 0 ${size} ${size}" role="img" aria-label="六维气象图">
    ${rings}${axes}
    <polygon class="shape" points="${shape.join(' ')}"/>
    ${dots}${labels}
  </svg>`;
}

/* ---------------- 罗盘 ---------------- */
function compassSVG(mountains, guas) {
  const C = 160;
  let ticks = '';
  for (let d = 0; d < 360; d += 5) {
    const major = d % 15 === 0;
    const [x1, y1] = pt(C, C, 127, d);
    const [x2, y2] = pt(C, C, major ? 135 : 132, d);
    ticks += `<line class="cp-tick${major ? ' major' : ''}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke-width="${major ? 0.9 : 0.5}"/>`;
  }

  let shan = '';
  mountains.forEach((m) => {
    const [x, y] = pt(C, C, 145, m.deg);
    shan += `<text class="cp-shan" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" data-deg="${m.deg}">${m.n}</text>`;
  });

  let guaLabels = '';
  Object.entries(guas).forEach(([, g]) => {
    const [x, y] = pt(C, C, 112, g.angle);
    guaLabels += `<text class="cp-gua" x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle">${g.glyph}</text>`;
  });

  return `
  <svg viewBox="0 0 320 320" role="img" aria-label="二十四山罗盘">
    <circle class="cp-ring-outer" cx="160" cy="160" r="156"/>
    <circle class="cp-ring-outer" cx="160" cy="160" r="136" stroke-opacity=".22"/>
    <circle class="cp-ring-outer" cx="160" cy="160" r="96" stroke-opacity=".18"/>
    <g id="cpDial">
      <g class="cp-ticks">${ticks}</g>
      ${shan}
      ${guaLabels}
    </g>
    <g id="cpNeedle">
      <line class="cp-needle" x1="160" y1="160" x2="160" y2="86"/>
      <line class="cp-needle-tail" x1="160" y1="160" x2="160" y2="196"/>
      <path class="cp-hand" d="M160 80 L155 92 L165 92 Z"/>
      <circle cx="160" cy="160" r="3.2" fill="#0F1916" stroke="#A98A4E" stroke-opacity=".6"/>
    </g>
  </svg>`;
}

/* ---------------- 提示与弹层 ---------------- */
let toastTimer;
function toast(msg, opts = {}) {
  let t = $('.toast');
  if (!t) {
    t = document.createElement('div');
    t.className = 'toast';
    t.setAttribute('role', 'status');
    t.setAttribute('aria-live', 'polite');
    document.body.appendChild(t);
  }
  t.innerHTML = `<span>${esc(msg)}</span>${opts.actionLabel ? '<button class="toast-act" type="button">' + esc(opts.actionLabel) + '</button>' : ''}`;
  t.onclick = (e) => {
    if (!e.target.closest('.toast-act')) return;
    t.classList.remove('on');
    opts.onAction?.();
  };
  const ms = opts.ms || (opts.actionLabel ? 6000 : 2400);
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), ms);
}

let lastFocus = null;
function openSheet(html, opts = {}) {
  const layer = $('#layer');
  lastFocus = document.activeElement;
  layer.innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(opts.label || '对话框')}" tabindex="-1">${html}</div>`;
  document.body.classList.add('sheet-open');
  requestAnimationFrame(() => layer.classList.add('on'));

  const sheet = $('.sheet', layer);
  $$('[data-close]', layer).forEach((b) => b.addEventListener('click', closeSheet));

  /* 默认聚焦「安全的那个」：优先 data-close，绝不默认聚焦删除 */
  const safe = $('[data-close]', sheet) || sheet;
  safe.focus?.();

  /* 焦点锁在弹层内 + Esc 关闭 */
  sheet.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      closeSheet();
      return;
    }
    if (e.key !== 'Tab') return;
    const items = [...sheet.querySelectorAll('button, a[href], input, [tabindex]:not([tabindex="-1"])')]
      .filter((el) => !el.disabled && el.offsetParent !== null);
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });
}

function closeSheet() {
  const layer = $('#layer');
  layer.classList.remove('on');
  document.body.classList.remove('sheet-open');
  setTimeout(() => { layer.innerHTML = ''; }, 380);
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

/* ---------------- 图片 ---------------- */
function pickImage(cb) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.addEventListener('change', async () => {
    const file = input.files?.[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) return toast('请选择图片文件');
    try {
      cb(await shrink(file, 720, 0.82));
    } catch {
      toast('这张图读不出来，换一张试试');
    }
  });
  input.click();
}

function shrink(file, max, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}

/* ---------------- 站内跳转：不依赖 location（受限面板可能锁 URL） ---------------- */
function go(hash) {
  try { location.hash = hash; } catch { /* 面板限制时忽略 */ }
  if (typeof window.__route === 'function') window.__route(hash);
}

/* 替换当前历史记录再跳转：用于“算完出结果”，返回时回到输入页而不是上一个结果 */
function goReplace(hash) {
  try {
    const h = String(hash).replace(/^#/, '');
    history.replaceState(null, '', '#' + h);
    if (typeof window.__route === 'function') window.__route('#' + h);
    else window.dispatchEvent(new Event('hashchange'));
  } catch {
    go(hash);
  }
}

/* 返回上一页；优先走 app.js 的站内足迹，直接打开链接时退回 fallback */
function goBack(fallback = '#/') {
  if (typeof window.__back === 'function') {
    window.__back(fallback);
    return;
  }
  try { history.back(); } catch { go(fallback); return; }
  const before = location.hash;
  setTimeout(() => {
    if (location.hash === before) go(fallback);
  }, 280);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制，可粘贴到任意地方');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch { toast('复制失败，请长按选择'); }
    ta.remove();
  }
}

  g.fillStyle = 'rgba(36,31,23,.45)';

  g.fillText(r.level?.note || '', W - 100, 506);

  a.href = cv.toDataURL('image/png');
  a.click();
  toast('已生成图片，请查看下载');

function wrapText(g, text, x, y, maxW, lineH, maxLines) {
  const chars = [...text];
  let line = '';
  let lines = 0;
  for (const ch of chars) {
    const test = line + ch;
    if (g.measureText(test).width > maxW && line) {
      g.fillText(line, x, y);
      y += lineH;
      lines++;
      line = ch;
      if (lines >= maxLines - 1) break;
    } else {
      line = test;
    }
  }
  if (line && lines < maxLines) g.fillText(line, x, y);
}

/* 农历与时辰：用浏览器内置的中国历法（ICU），不引第三方库 */
function lunarParts(date = new Date()) {
  try {
    const fmt = new Intl.DateTimeFormat('en-u-ca-chinese', { month: 'numeric', day: 'numeric' });
    const parts = Object.fromEntries(fmt.formatToParts(date).map((p) => [p.type, p.value]));
    const month = Number(parts.month);
    const day = Number(parts.day);
    if (!month || !day) return null;
    return { month, day };
  } catch {
    return null;
  }
}

/* 子 1 … 亥 12，23:00–01:00 为子 */
function zhiIndexNow(date = new Date()) {
  return Math.floor((((date.getHours() + 1) % 24)) / 2) + 1;
}

function nowLabel(date = new Date()) {
  const p = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())} ${p(date.getHours())}:${p(date.getMinutes())}`;
}


/* ===== assets/js/facemesh.js ===== */
/* ==========================================================================
   facemesh.js — 浏览器本地人脸关键点测量（MediaPipe Face Landmarker）
   照片不离开设备；量出比例后只把数字发给服务端。
   ========================================================================== */

const BASE = '/assets/vendor/mediapipe/';

let landmarkerPromise = null;

async function getLandmarker() {
  if (!landmarkerPromise) {
    landmarkerPromise = (async () => {
      const { FaceLandmarker, FilesetResolver } = await import(`${BASE}vision_bundle.mjs`);
      const vision = await FilesetResolver.forVisionTasks(`${BASE}wasm`);
      const make = (delegate) => FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: `${BASE}face_landmarker.task`,
          delegate,
        },
        runningMode: 'IMAGE',
        numFaces: 1,
        minFaceDetectionConfidence: 0.4,
        minFacePresenceConfidence: 0.4,
        minTrackingConfidence: 0.4,
      });
      try {
        return await make('GPU');
      } catch {
        return await make('CPU');
      }
    })().catch((e) => {
      landmarkerPromise = null;
      throw e;
    });
  }
  return landmarkerPromise;
}

const loadImage = (src) => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => resolve(img);
  img.onerror = () => reject(new Error('图片读取失败'));
  img.src = src;
});

const dist = (a, b, w, h) => Math.hypot((a.x - b.x) * w, (a.y - b.y) * h);
const r3 = (x) => Math.round(x * 1000) / 1000;

function computeMetrics(p, w, h) {
  const P = (i) => p[i];
  const W = dist(P(234), P(454), w, h) || 1;
  const H = dist(P(10), P(152), w, h) || 1;

  const d = (i, j) => dist(P(i), P(j), w, h);
  const eyeR = d(33, 133);
  const eyeL = d(362, 263);
  const eyeAvg = (eyeR + eyeL) / 2 || 1;

  const upper = d(10, 168) / H;
  const middle = d(168, 2) / H;
  const lower = d(2, 152) / H;

  return {
    faceWH: r3(H / W),
    upper: r3(upper),
    middle: r3(middle),
    lower: r3(lower),
    eyeWidth: r3(eyeAvg / W),
    eyeGap: r3(d(133, 362) / eyeAvg),
    eyeTilt: r3((P(263).y - P(33).y)),   // >0 外眼角低（下垂），<0 上扬
    eyeOpen: r3(((d(159, 145) + d(386, 374)) / 2) / eyeAvg),
    noseWidth: r3(d(129, 358) / W),
    noseLen: r3(d(168, 2) / H),
    mouthWidth: r3(d(61, 291) / W),
    lipThick: r3(d(0, 17) / H),
    jawWidth: r3(d(172, 397) / W),
    chinWidth: r3(d(148, 377) / W),
    chinRatio: r3(d(148, 377) / (d(172, 397) || 1)),
    cheekWidth: r3(d(116, 345) / W),
    cheekJawRatio: r3(d(116, 345) / (d(172, 397) || 1)),
    chinHeight: r3(d(2, 152) / H),
    browEye: r3(((d(105, 159) + d(334, 386)) / 2) / H),
    source: 'mediapipe-468',
    points: 468,
  };
}

/* 返回 { measures, ok, reason } */
async function measureFace(dataUrl) {
  try {
    const lm = await getLandmarker();
    const img = await loadImage(dataUrl);
    const res = lm.detect(img);
    const face = res?.faceLandmarks?.[0];
    if (!face || face.length < 400) return { ok: false, reason: 'no-face' };
    return { ok: true, measures: computeMetrics(face, img.naturalWidth, img.naturalHeight) };
  } catch (e) {
    return { ok: false, reason: e?.message || 'measure-failed' };
  }
}

/* ==========================================================================
   sensors.js — 方向与定位
   注意：iOS/Android 的传感器与定位都要求安全上下文（https 或 localhost）。
   ========================================================================== */

const hasHeading = () => 'DeviceOrientationEvent' in window;

async function startHeading(onHeading) {
  if (!hasHeading()) throw new Error('此设备不支持方向感应');

  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    const res = await DeviceOrientationEvent.requestPermission();
    if (res !== 'granted') throw new Error('未授权方向权限');
  }

  const absolute = 'ondeviceorientationabsolute' in window;
  const handler = (e) => {
    let h = null;
    if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
    else if (typeof e.alpha === 'number') h = 360 - e.alpha;
    if (h !== null && Number.isFinite(h)) onHeading(h);
  };

  const evt = absolute ? 'deviceorientationabsolute' : 'deviceorientation';
  window.addEventListener(evt, handler, true);
  return () => window.removeEventListener(evt, handler, true);
}

function locate(timeout = 9000) {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('此设备不支持定位'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({
        lat: Number(pos.coords.latitude.toFixed(6)),
        lng: Number(pos.coords.longitude.toFixed(6)),
        acc: Math.round(pos.coords.accuracy),
        alt: pos.coords.altitude == null ? null : Math.round(pos.coords.altitude),
      }),
      (err) => {
        const msg = err.code === 1 ? '定位权限被拒绝'
          : err.code === 2 ? '定位不可用'
            : err.code === 3 ? '定位超时' : '定位失败';
        reject(new Error(msg));
      },
      { enableHighAccuracy: true, timeout, maximumAge: 60000 },
    );
  });
}

/* 用识别结果里的关键项去典籍里找依据 */
const KEYWORDS = {
  face: ['三停', '五官', '五岳', '气色', '骨相', '痣'],
  palm: ['掌型', '生命线', '智慧线', '感情线', '掌丘', '指长'],
};

async function collectCitations(type, answers, questions) {
  const labels = questions
    .map((q) => {
      const v = answers[q.id];
      return v ? q.options.find((o) => o.v === v)?.label : '';
    })
    .filter(Boolean);

  const words = [...new Set([...(KEYWORDS[type] || []), ...labels])].slice(0, 6);

  const out = [];
  for (const w of words) {
    try {
      const { results } = await api.search(w, 'xiang', 2);
      results.forEach((r) => out.push(r));
    } catch { /* 服务不可用时留空 */ }
  }

  const seen = new Set();
  return out
    .filter((r) => {
      const k = r.text.slice(0, 24);
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    })
    .sort((a, b) => (a.kind === '原文' ? -1 : 1) - (b.kind === '原文' ? -1 : 1))
    .slice(0, 5)
    .map((r) => ({ book: r.book, bookTitle: r.bookTitle, chapter: r.chapter, kind: r.kind, text: r.text }));
}

function readingView(cfg) {
  const { module: MOD, type, draftKey } = cfg;
  const saved = store.get()[draftKey];
  const draft = {
    answers: { ...(saved?.answers || {}) },
    photo: saved?.photo || null,
  };

  Object.keys(draft.answers).forEach((qid) => {
    const q = MOD.questions.find((x) => x.id === qid);
    if (!q || !q.options.some((o) => o.v === draft.answers[qid])) delete draft.answers[qid];
  });

  const required = MOD.questions;
  const countAnswered = () => required.filter((q) => draft.answers[q.id]).length;

  const html = `
    <div class="flow">
      <header class="page-head">
        <a class="back" href="#/" data-back>
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>返回
        </a>
        <h1>${esc(MOD.title)}</h1>
        <a class="tb-link right" href="#/about">相法</a>
      </header>

      <p class="lead">${esc(MOD.lead)}</p>

      <div class="photo-slot" data-slot>${photoHtml(draft.photo, type)}</div>

      <p class="auto-note">上传照片，点下面的「看 相」，马上出结果，不用做题。</p>

      <p class="scan-status" data-scan hidden><span class="spinner"></span><span>正在识别照片，约 5–15 秒…</span></p>

      <button class="manual-link" type="button" data-manual-toggle>没有照片，或想自己逐项选</button>

      <div data-manual hidden>
        ${MOD.questions.map(questionHtml).join('')}
        <p class="foot">逐项选好后点下方按钮，本机生成批注。</p>
      </div>
    </div>

    <div class="dock">
      <div class="dock-info"><b data-count>${countAnswered()}/${required.length}</b><span data-count-label>已落笔</span></div>
      <button class="btn btn-primary" type="button" data-go>看 相</button>
    </div>`;

  const mount = () => {
    const root = $('#app .view');
    const goBtn = $('[data-go]', root);
    const countEl = $('[data-count]', root);
    const countLabel = $('[data-count-label]', root);
    const slot = $('[data-slot]', root);
    const manual = $('[data-manual]', root);
    const scan = $('[data-scan]', root);
    let manualMode = false;

    const refresh = () => {
      const n = countAnswered();
      countEl.textContent = manualMode ? `${n}/${required.length}` : '—';
      countLabel.textContent = manualMode ? '已落笔' : '照片识别';
      goBtn.disabled = manualMode && n < required.length;
    };

    const paintAnswers = () => {
      root.querySelectorAll('.opt[aria-pressed="true"]').forEach((b) => {
        b.setAttribute('aria-pressed', 'false');
        const n = b.closest('.q-body')?.querySelector('.group-note');
        if (n) n.textContent = '';
      });
      for (const [qid, v] of Object.entries(draft.answers)) {
        const btn = root.querySelector(`[data-q="${qid}"][data-v="${v}"]`);
        if (!btn) continue;
        btn.setAttribute('aria-pressed', 'true');
        const q = MOD.questions.find((x) => x.id === qid);
        const opt = q?.options.find((o) => o.v === v);
        const note = btn.closest('.q-body')?.querySelector('.group-note');
        if (note && opt) note.textContent = opt.note || '';
      }
      refresh();
    };

    const setManual = (on) => {
      manualMode = on;
      manual.hidden = !on;
      goBtn.textContent = on ? '生成批注' : '看 相';
      refresh();
    };
    paintAnswers();
    setManual(false);

    /* 在线版先探一次视觉模型，没配就地提示，不等到点「看相」才报错 */
    if (location.protocol !== 'file:') {
      api.visionStatus().then((s) => {
        if (s?.ready) return;
        const warn = document.createElement('div');
        warn.className = 'inline-warn';
        warn.innerHTML = '<p>视觉模型未配置：在 启动.bat 里设置 FATETELL_VISION_MODEL 与 KEY，然后重启服务。也可以自己逐项选。</p><button class="btn btn-ghost btn-sm" type="button" data-manual-toggle>自己逐项选</button>';
        slot.after(warn);
      }).catch(() => { /* 服务没起时保持安静 */ });
    }

    const finish = async (answers, auto, visionMeta) => {
      const report = type === 'face' ? buildFace(answers) : buildPalm(answers);
      try {
        report.citations = await collectCitations(type, answers, required);
      } catch { /* 无依据也能出批注 */ }
      const rec = makeRecord(report);
      rec.meta = { ...(rec.meta || {}), auto: Boolean(auto) };
      if (visionMeta) rec.meta.vision = visionMeta;
      store.addReport(rec);
      go(`#/report/${rec.id}`);
    };

    const look = () => {
      if (!draft.photo) {
        toast(type === 'face' ? '先上传一张正面照' : '先上传一张掌心照');
        return;
      }
      openSheet(`
        <h2>把照片发给视觉模型？</h2>
        <p>我们会看这张照片，然后直接给出结果。照片不会保存，也不会写进记录里。</p>
        <p>不用您一项项选，直接看结论就行。</p>
        <div class="acts">
          <button class="btn btn-primary" type="button" data-confirm>发送并看相</button>
          <button class="btn btn-ghost" type="button" data-close>取消</button>
        </div>`, { label: '照片识别确认' });

      $('[data-confirm]')?.addEventListener('click', async () => {
        closeSheet();
        goBtn.disabled = true;
        goBtn.innerHTML = '<span class="spinner"></span>看 相 中';
        scan.hidden = false;
        scan.scrollIntoView({ behavior: 'smooth', block: 'center' });
        toast('识别中，约 5–15 秒');
        try {
          let local = null;
          if (type === 'face') {
            try {
              const m = await measureFace(draft.photo);
              if (m.ok) {
                local = m.measures;
                draft.measures = local;
              }
            } catch { /* 关键点不可用就走模型估测 */ }
          }
          const out = await api.vision(type, draft.photo, local);
          const entries = Object.entries(out.features || {});
          if (!entries.length) {
            toast('模型没看清，可以换张照片，或自己逐项选');
            return;
          }
          entries.forEach(([qid, v]) => { draft.answers[qid] = v; });
          try { store.saveDraft(type, draft); } catch { /* 存储满也不影响本次结果 */ }
          paintAnswers();
          const items = required
            .map((q) => ({ t: q.title, v: q.options.find((o) => o.v === draft.answers[q.id])?.label || '' }))
            .filter((x) => x.v);
          await finish({ ...draft.answers }, true, {
            confidence: out.confidence ?? null,
            model: out.model || null,
            measures: out.measures || null,
            applied: out.applied || [],
            basis: out.basis || [],
            items,
          });
        } catch (err) {
          const msg = String(err.message || '');
          if (err.status === 503) {
            if (location.protocol === 'file:') {
              toast('这是离线包，不接视觉模型。用「启动.bat」打开在线版再看相');
            } else {
              toast('视觉模型未配置：检查 启动.bat 里的 FATETELL_VISION_MODEL 后重启服务');
            }
          } else if (/超时|超時|timeout/i.test(msg)) {
            toast('识别超时了，换个网络或稍后再点一次');
          } else if (/没有返回结果|截断/.test(msg)) {
            toast('模型这次没给出结果，再点一次「看 相」');
          } else if (/格式|过大|不支持/.test(msg)) {
            toast('这张照片读不了，换成 JPG 或 PNG 再试');
          } else {
            toast(msg || '识别失败，再试一次');
          }
        } finally {
          scan.hidden = true;
          goBtn.disabled = false;
          goBtn.textContent = manualMode ? '生成批注' : '看 相';
        }
      });
    };

    root.addEventListener('click', (e) => {
      const optBtn = e.target.closest('.opt');
      if (optBtn) {
        const qid = optBtn.dataset.q;
        const v = optBtn.dataset.v;
        const group = optBtn.closest('.q-body');
        group.querySelectorAll('.opt').forEach((b) => b.setAttribute('aria-pressed', 'false'));
        optBtn.setAttribute('aria-pressed', 'true');
        draft.answers[qid] = v;
        const q = MOD.questions.find((x) => x.id === qid);
        const o = q?.options.find((x) => x.v === v);
        const note = group.querySelector('.group-note');
        if (note) note.textContent = o?.note || '';
        store.saveDraft(type, draft);
        refresh();
        return;
      }

      if (e.target.closest('[data-manual-toggle]')) {
        const on = !manualMode;
        setManual(on);
        if (on) manual.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }

      if (e.target.closest('[data-photo]')) {
        pickImage((dataUrl) => {
          draft.photo = dataUrl;
          try { store.saveDraft(type, draft); } catch { /* 本机存储满，仍用内存里的照片 */ }
          slot.innerHTML = photoHtml(draft.photo, type);
          toast('照片已添加');
        });
        return;
      }

      if (e.target.closest('[data-photo-clear]')) {
        draft.photo = null;
        store.saveDraft(type, draft);
        slot.innerHTML = photoHtml(null, type);
        return;
      }

      if (e.target.closest('[data-go]')) {
        if (!manualMode) {
          look();
          return;
        }
        const n = countAnswered();
        if (n < required.length) {
          const firstMissing = required.find((q) => !draft.answers[q.id]);
          toast(`还有一题未落笔：${firstMissing?.title || ''}`);
          return;
        }
        finish({ ...draft.answers }, false);
      }
    });
  };

  return { html, mount };
}

      <div class="dock-info"><b data-count>${readyCount()}/3</b>已齐备</div>
      <button class="btn btn-primary" type="button" data-submit ${isComplete() ? '' : 'disabled'}>合参</button>
    </div>`;

  const mount = () => {
    const root = $('#app .view');
    const submit = $('[data-submit]', root);
    const countEl = $('[data-count]', root);
    const preview = $('[data-preview]', root);

    const refresh = () => {
      countEl.textContent = `${readyCount()}/3`;
      submit.disabled = !isComplete();
      if (birth.year && birth.hour) {
        const el = elementsOf(birth);
        preview.innerHTML = `<p class="preview-line">${esc(el.gan + el.zhi)}年　纳音${esc(el.nayin)}　${esc(el.dom)}旺${esc(el.weak)}弱　<span>「${esc(el.ge)}」</span></p>`;
      } else {
        preview.innerHTML = '';
      }
      const state3 = root.querySelectorAll('.ready-state')[2];
      if (state3) {
        const ok = !!(birth.year && birth.hour && birth.gender);
        state3.className = `ready-state ${ok ? 'done' : 'todo'}`;
        state3.innerHTML = ok ? '已成' : '<a href="#birth">填写</a>';
      }
      const notes = root.querySelectorAll('.ready-note');
      if (notes[2]) {
        notes[2].textContent = birth.year
          ? `${birth.year}年${birth.month}月${birth.day}日 · ${birth.hour}时 · ${birth.gender === 'male' ? '男' : birth.gender === 'female' ? '女' : '性别未填'}`
          : '公历生日与时辰';
      }
      if (notes[0] && face) notes[0].textContent = `已录：${face.overall} 分 · ${face.dateLabel}`;
      if (notes[1] && palm) notes[1].textContent = `已录：${palm.overall} 分 · ${palm.dateLabel}`;
    };

    root.addEventListener('change', (e) => {
      const input = e.target.closest('[data-date]');
      if (!input || !input.value) return;
      const [y, m, d] = input.value.split('-').map(Number);
      birth = { ...birth, year: y, month: m, day: d };
      store.patch({ birth });
      refresh();
    });

    root.addEventListener('click', (e) => {
      const h = e.target.closest('[data-hour]');
      if (h) {
        birth = { ...birth, hour: h.dataset.hour };
        root.querySelectorAll('[data-hour]').forEach((b) => b.setAttribute('aria-pressed', String(b === h)));
        store.patch({ birth });
        refresh();
        return;
      }
      const g = e.target.closest('[data-gender]');
      if (g) {
        birth = { ...birth, gender: g.dataset.gender };
        root.querySelectorAll('[data-gender]').forEach((b) => b.setAttribute('aria-pressed', String(b === g)));
        store.patch({ birth });
        refresh();
        return;
      }
      if (e.target.closest('[data-submit]')) {
        if (!face || !palm) {
          toast('先把面相和手相各做一次');
          return;
        }
        if (!(birth.year && birth.hour && birth.gender)) {
          toast('还差生日、时辰或性别');
          return;
        }
        const report = buildCombo(face, palm, birth);
        const rec = store.addReport(makeRecord(report));
        go(`#/report/${rec.id}`);
      }
    });

    refresh();
  };

  return { html, mount };
}

          </div>

        </div>

        <button class="more-toggle" type="button" data-more-toggle aria-expanded="false">
          再加床 / 灶 / 书桌的方位（可选）
        </button>

        <div class="more-fields" data-more hidden>
          <div class="field">
            <label>床头所在方位（按命卦）</label>
            ${dirGrid('bed', '床')}
          </div>

          <div class="field">
            <label>灶所在方位（按宅卦）</label>
            ${dirGrid('stove', '灶')}
          </div>

          <div class="field">
            <label>书桌所在方位（按命卦）</label>
            ${dirGrid('desk', '桌')}
          </div>
        </div>
      </section>

      <p class="foot">八宅法只论方位，不替代采光、通风与结构安全。</p>
    </div>

    <div class="dock">
      <div class="dock-info"><b data-count>0/3</b>必填</div>
      <button class="btn btn-primary" type="button" data-submit disabled>看宅运</button>
    </div>`;

  const mount = () => {
    const root = $('#app .view');
    const stage = $('[data-stage]', root);
    const needle = $('#cpNeedle', root);
    const degEl = $('[data-readout]', root);
    const dirEl = $('[data-dir]', root);
    const hint = $('[data-hint]', root);
    const submit = $('[data-submit]', root);
    const countEl = $('[data-count]', root);

    const readyCount = () => (birth.year ? 1 : 0) + (birth.gender ? 1 : 0) + (door ? 1 : 0);
    const ready = () => !!(birth.year && birth.gender && door);

    const refreshDock = () => {
      countEl.textContent = `${readyCount()}/3`;
      submit.disabled = !ready();
    };

    const paint = () => {
      const facing = mountainAt(heading);
      const sitting = mountainAt(heading + 180);
      needle.setAttribute('transform', `rotate(${norm360(heading).toFixed(1)} 160 160)`);
      degEl.textContent = `朝向 ${Math.round(norm360(heading))}° · ${facing.gua}卦 · ${GUAS[facing.gua].dir}`;
      dirEl.innerHTML = `坐 <span>${sitting.n}</span> 向 ${facing.n}`;
      $$('.cp-shan', root).forEach((t) => {
        const d = Number(t.dataset.deg);
        t.classList.toggle('hot', d === facing.deg || d === sitting.deg);
      });
    };

    const setHeading = (h) => {
      heading = norm360(h);
      paint();
    };

    paint();
    refreshDock();

    $$('[data-face]', root).forEach((b) => {
      b.addEventListener('click', () => {
        if (locked) return;
        setHeading(Number(b.dataset.face));
        $$('[data-face]', root).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        hint.textContent = '已按所选方向定盘，可再微调';
      });
    });

    /* --- 拖动转盘 --- */
    const angleAt = (e) => {
      const r = stage.getBoundingClientRect();
      const x = e.clientX - (r.left + r.width / 2);
      const y = e.clientY - (r.top + r.height / 2);
      return (Math.atan2(x, -y) * 180) / Math.PI;
    };
    let dragging = false;
    let startAngle = 0;
    let startHeading = 0;

    stage.addEventListener('pointerdown', (e) => {
      if (locked) return;
      dragging = true;
      startAngle = angleAt(e);
      startHeading = heading;
      stage.setPointerCapture?.(e.pointerId);
      hint.textContent = '转到你想要的朝向，松手即定';
    });
    stage.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      setHeading(startHeading + (angleAt(e) - startAngle));
    });
    const stop = () => {
      if (!dragging) return;
      dragging = false;
      heading = Math.round(norm360(heading));
      paint();
      store.patch({ compassDraft: { ...(store.get().compassDraft || {}), heading, door, ...birth } });
    };
    stage.addEventListener('pointerup', stop);
    stage.addEventListener('pointercancel', stop);

    /* --- 设备指南针 --- */
    const sensorBtn = $('[data-sensor]', root);
    if (!('DeviceOrientationEvent' in window)) sensorBtn.style.display = 'none';

    sensorBtn.addEventListener('click', async () => {
      if (sensorOn) {
        window.removeEventListener('deviceorientationabsolute', sensorHandler, true);
        window.removeEventListener('deviceorientation', sensorHandler, true);
        sensorOn = false;
        sensorBtn.textContent = '启用指南针';
        hint.textContent = '已关闭传感器，可继续拖动转盘';
        return;
      }
      try {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res !== 'granted') {
            toast('未获得方向权限，可拖动转盘');
            return;
          }
        }
        sensorHandler = (e) => {
          if (locked) return;
          let h = null;
          if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
          else if (typeof e.alpha === 'number') h = 360 - e.alpha;
          if (h === null) return;
          setHeading(h);
        };
        const absolute = 'ondeviceorientationabsolute' in window;
        window.addEventListener(absolute ? 'deviceorientationabsolute' : 'deviceorientation', sensorHandler, true);
        sensorOn = true;
        sensorBtn.textContent = '关闭指南针';
        hint.textContent = '转动手机，让顶部指向大门；读数有偏差时手动微调';
      } catch {
        toast('此设备不支持方向感应，请拖动转盘');
      }
    });

    /* --- 定盘 --- */
    const lockBtn = $('[data-lock]', root);
    lockBtn.addEventListener('click', () => {
      locked = !locked;
      lockBtn.textContent = locked ? '重新定盘' : '定盘';
      stage.style.cursor = locked ? 'default' : '';
      if (locked) {
        heading = Math.round(norm360(heading));
        paint();
        hint.textContent = `已定盘：坐 ${mountainAt(heading + 180).n} 向 ${mountainAt(heading).n}`;
        store.patch({ compassDraft: { ...(store.get().compassDraft || {}), heading, door, ...birth } });
      } else {
        hint.textContent = '拖动转盘，或启用设备指南针';
      }
    });

    /* --- 表单 --- */
    root.addEventListener('change', (e) => {
      const input = e.target.closest('[data-year]');
      if (!input) return;
      const y = Number(input.value);
      birth.year = y >= 1900 && y <= 2100 ? y : null;
      if (input.value && !birth.year) {
        input.value = '';
        toast('请填 1900 至 2100 之间的年份');
      }
      store.patch({ compassDraft: { ...(store.get().compassDraft || {}), heading, door, ...birth } });
      refreshDock();
    });

    const more = $('[data-more]', root);
    const moreBtn = $('[data-more-toggle]', root);
    moreBtn?.addEventListener('click', () => {
      const open = more.hasAttribute('hidden');
      if (open) more.removeAttribute('hidden');
      else more.setAttribute('hidden', '');
      moreBtn.setAttribute('aria-expanded', String(open));
      moreBtn.textContent = open ? '收起可选方位' : '再加床 / 灶 / 书桌的方位（可选）';
    });

    root.addEventListener('click', (e) => {
      const g = e.target.closest('[data-gender]');
      if (g) {
        birth.gender = g.dataset.gender;
        root.querySelectorAll('[data-gender]').forEach((b) => b.setAttribute('aria-pressed', String(b === g)));
        store.patch({ compassDraft: { ...(store.get().compassDraft || {}), heading, door, ...birth } });
        refreshDock();
        return;
      }

      const d = e.target.closest('[data-door]');
      if (d) {
        door = d.dataset.door;
        root.querySelectorAll('[data-door]').forEach((b) => b.setAttribute('aria-pressed', String(b === d)));
        store.patch({ compassDraft: { ...(store.get().compassDraft || {}), heading, door, ...birth } });
        refreshDock();
        return;
      }

      const place = e.target.closest('[data-bed], [data-stove], [data-desk]');
      if (place) {
        const key = place.dataset.bed ? 'bed' : place.dataset.stove ? 'stove' : 'desk';
        const val = place.dataset[key] || place.textContent;
        const cur = key === 'bed' ? bed : key === 'stove' ? stove : desk;
        const next = cur === val ? null : val;
        if (key === 'bed') bed = next;
        if (key === 'stove') stove = next;
        if (key === 'desk') desk = next;
        root.querySelectorAll(`[data-${key}]`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset[key] === next)));
        return;
      }

      if (e.target.closest('[data-submit]')) {
        if (!birth.year) {
          toast('先填出生年');
          return;
        }
        if (!birth.gender) {
          toast('还差性别');
          return;
        }
        if (!door) {
          toast('选一个入户门方位');
          return;
        }
        const base = buildCompass({
          heading,
          birthYear: birth.year,
          gender: birth.gender,
          door,
        });
        const houseMap = BAZHAI[base.meta.houseGua];
        const mingMap = BAZHAI[base.meta.mGua];
        const picks = [
          ['大门', door, '宅卦'],
          ['灶', stove, '宅卦'],
          ['床', bed, '命卦'],
          ['书桌', desk, '命卦'],
        ].filter((x) => x[1]);
        const rows = picks.map(([name, g, basis]) => {
          const star = (basis === '命卦' ? mingMap : houseMap)[g];
          return { name, dir: GUAS[g].dir, star: star.name, level: star.level, good: star.good };
        });
        const goodN = rows.filter((r) => r.good).length;
        const score = Math.round(Math.max(45, Math.min(92,
          62 + goodN * 6 - (rows.length - goodN) * 4 + (base.meta.match ? 4 : 0))));
        const mingGood = ['生气', '天医', '延年'].map((s) => {
          const g = Object.keys(mingMap).find((x) => mingMap[x].name === s);
          return { s, dir: GUAS[g].dir };
        });
        const bad = rows.filter((r) => !r.good);

        const report = {
          ...base,
          overall: score,
          level: levelOf(score),
          blocks: [{
            kind: 'table',
            title: '摆放',
            head: ['位置', '方位', '星', '吉凶'],
            rows: rows.map((r) => [r.name, r.dir, r.star, r.level]),
          }],
          advice: [
            `床头宜朝${mingGood[0].dir}（生气）或${mingGood[1].dir}（天医），按命卦算，不按宅卦。`,
            base.meta.match
              ? '命宅同组，格局本来就顺；先处理采光、通风、动线，再谈方位。'
              : '命宅不同组，不必改门；把床、书桌挪到命卦吉方即可。',
            bad.length
              ? `有 ${bad.length} 处落在凶方：${bad.map((r) => r.name + '（' + r.star + '）').join('、')}，能挪则挪，挪不动就用柜体、帘子隔断，别久卧久坐。`
              : '门、床、灶、桌都在吉方，剩下的就是把光、风、水处理好。',
          ],
          cautions: bad.map((r) => `${r.name}在${r.dir}方，为${r.star}（${r.level}）。`),
        };
        const rec = store.addReport(makeRecord(report));
        go(`#/report/${rec.id}`);
      }
    });

  };

  return { html, mount };
}


/* ===== assets/js/views/report.js ===== */




const SEAL = ['相', '由', '心', '生'];

const KIND = { face: '面相', palm: '手相', combo: '综合相', compass: '罗盘风水', ming: '四柱', bu: '小六壬', ze: '择日', hepan: '合盘' };
const AGAIN = { face: '#/face', palm: '#/palm', combo: '#/combo', compass: '#/compass', ming: '#/ming', bu: '#/bu', ze: '#/ze', kan: '#/yinzha', hepan: '#/hepan' };
const SCORE_LABEL = { compass: '宅运', kan: '地气', ming: '命格', bu: '课象', ze: '日课', hepan: '合盘' };

/* 把已算好的结果压成一段给模型看的上下文；模型只读不写 */
function chartText(rec) {
  const L = [];
  if (rec.summary) L.push(rec.summary);
  (rec.blocks || []).forEach((b) => {
    if (b.kind === 'table') L.push(`${b.title}：${b.head.join('｜')}；${b.rows.map((r) => r.join('｜')).join('；')}`);
    else if (b.kind === 'kv') L.push(`${b.title}：${b.rows.map(([k, v]) => `${k}${v}`).join('，')}`);
    else if (b.kind === 'list') L.push(`${b.title}：${b.items.join('；')}`);
    else if (b.kind === 'elems') L.push(`${b.title}：${b.items.map((e) => e.e + e.v).join(' ')}`);
    else L.push(`${b.title}：${b.text || ''}`);
  });
  if (rec.dims) L.push(`六维：${rec.dims.map((d) => d.label + d.v).join(' ')}`);
  if (rec.items) L.push(`逐项：${rec.items.map((i) => `${i.title}${i.chosen}`).join('；')}`);
  if (rec.stops) L.push(`三停：${rec.stops.map((s) => s.label + s.v).join(' ')}`);
  if (rec.tri) L.push(`三源：${rec.tri.map((t) => t.text).join(' ')}`);
  if (rec.meta?.houseGua) L.push(`宅${rec.meta.houseGua} 命${rec.meta.mGua} 坐${rec.meta.sitting.n}向${rec.meta.facing.n}`);
  if (rec.meta?.question) L.push(`所问：${rec.meta.question}`);
  L.push(`批语：${rec.verdict}`);

  const others = store.get().reports
    .filter((r) => r.id !== rec.id && r.type !== rec.type)
    .slice(0, 3);
  if (others.length) {
    L.push(`其他批注：${others.map((o) => `${KIND[o.type] || o.heading || ''}${o.overall ? o.overall + '分' : ''}`).join('；')}`);
    L.push('请先用一句话总括这些批注，再聚焦当前这一门给建议。');
  }
  return L.join('\n');
}

const llmInner = (llm) => `

/* 照片看相：把模型看到的项折起来，可查、不抢结论 */
function visionBlock(rec) {
  const v = rec.meta?.vision;
  if (!v?.items?.length) return '';
  const conf = Number.isFinite(v.confidence) ? ` · 置信度 ${v.confidence}` : '';
  const mm = v.measures;
  const src = mm?.source === 'mediapipe-468' ? '468 点实测' : '模型估测';
  const mline = mm
    ? `<p class="vision-measure">${src}：${[
        mm.faceWH != null ? `脸长宽比 ${mm.faceWH}` : '',
        mm.upper != null ? `三庭 ${Math.round(mm.upper * 100)}/${Math.round((mm.middle || 0) * 100)}/${Math.round((mm.lower || 0) * 100)}` : '',
        mm.eyeGap != null ? `眼距 ${mm.eyeGap} 眼宽` : '',
        mm.eyeTilt != null ? `眼角倾斜 ${mm.eyeTilt}` : '',
        mm.noseWidth != null ? `鼻宽比 ${mm.noseWidth}` : '',
        mm.jawWidth != null ? `下颌比 ${mm.jawWidth}` : '',
        mm.cheekWidth != null ? `颧宽比 ${mm.cheekWidth}` : '',
      ].filter(Boolean).join(' · ')}</p>`
    : '';
  const basis = (v.basis || []).slice(0, 3);
  const basisLine = basis.length
    ? `<p class="vision-basis">依据：${basis.map((b) => `${esc(b.book)}·${esc(b.chapter)}`).join('；')}</p>`
    : '';
  return `
  <details class="vision-note">
    <summary>识别依据 · 模型看到的 ${v.items.length} 项${conf}</summary>
    <dl>${v.items.map((i) => `<div><dt>${esc(i.t)}</dt><dd>${esc(i.v)}</dd></div>`).join('')}</dl>
    <p>由照片识别得到，仅作预填；可在「相」页点「自己逐项选」修改后重出批注。</p>
    ${mline}
    ${basisLine}
    <p class="vision-limit">照片只能看形：神态、气色、举止无法从一张照片判断；相不独论，结论只作参考。</p>
  </details>`;
}

      <a class="tb-link" data-back data-parent="${parent}" href="${parent}">返回</a>
      <a class="tb-link" href="#/history">我的记录</a>

      <article class="paper">

          <span class="rep-side">${esc(rec.title)}</span>

          <header class="rep-head">
            <div class="rep-kicker">${esc(rec.dateLabel)}<span class="rep-tag">传统文化 · 娱乐参考</span></div>
            <h1 class="rep-title">${esc(rec.heading)}</h1>
            <p class="rep-sub">${esc(subtitle)}</p>
          </header>

          ${rec.overall != null ? `
          <div class="rep-score">
            <span class="n">${rec.overall}</span>
            <span class="unit">分 · ${scoreLabel}</span>
            <div class="lvl">
              <b>${esc(rec.level?.name || '')}</b>
              <span>${esc(rec.level?.note || '')}</span>
            </div>
          </div>` : ''}

          <section class="rep-sec">
            <h3>总评</h3>
            <p>${esc(rec.summary)}</p>
            ${rec.traits?.length ? `<div class="tags">${rec.traits.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
          </section>

          ${rec.blocks ? blocksBlock(rec) : ''}

          ${rec.type === 'compass' ? compassBlock(rec) : ''}

          ${rec.dims ? radarBlock(rec) : ''}
          ${stopsBlock(rec)}
          ${triBlock(rec)}
          ${elemsBlock(rec)}
          ${itemsBlock(rec)}

          ${listBlock('可恃之处', rec.strengths)}
          ${listBlock('需留意处', rec.cautions)}
          ${!rec.blocks ? listBlock('可做之事', rec.advice) : ''}
          ${rec.blocks && rec.advice?.length ? listBlock('可做之事', rec.advice) : ''}
          ${rec.llm ? llmBlock(rec.llm) : ''}

          <div class="verdict">
            <small>批 语</small>
            「${esc(rec.verdict)}」
          </div>

          <footer class="rep-foot">
            <div class="meta">仅供娱乐参考，不能代替医生、律师等专业意见。</div>
            <div class="seal">${SEAL.map((s) => `<span>${s}</span>`).join('')}</div>
          </footer>
        </div>
      </article>
    </div>

    <div class="rep-actions">
      <a class="btn btn-ghost" href="${again}">再算一次</a>
      <button class="btn btn-ghost" type="button" data-copy>复制</button>
      <button class="btn btn-line" type="button" data-card>存图</button>
    </div>

    <button class="btn btn-ghost btn-block" type="button" data-llm style="margin-top:8px">AI 建议 · 仅供娱乐</button>

    <p class="foot" style="margin-top:22px">批注已存在本机，换设备不会同步。</p>
    `,
    mount: () => {
      const root = $('#app .view');
      $('[data-copy]', root)?.addEventListener('click', () => copyText(recordToText(rec)));
      $('[data-card]', root)?.addEventListener('click', () => {
        try { saveCard(rec); } catch { toast('生成失败，请重试'); }
      });

      const btn = $('[data-llm]', root);

      const runLlm = async (auto = false) => {
        let placeholder = null;
        if (auto) {
          placeholder = document.createElement('section');
          placeholder.className = 'rep-sec llm';
          placeholder.innerHTML = '<h3>模型解读 · AI 建议</h3><p class="llm-loading">正在根据批注与知识库写解读…</p>';
          root.querySelector('.verdict')?.before(placeholder);
        }
        if (btn) {
          btn.disabled = true;
          btn.textContent = '模型解读中…';
        }
        try {
          const out = await api.interpret({
            kind: KIND[rec.type] || rec.heading || '解读',
            chart: chartText(rec),
            passages: rec.citations || [],
          });
          const llm = { text: out.text, model: out.model, at: Date.now() };
          store.updateReport(rec.id, { llm });
          rec.llm = llm;

          const sec = placeholder || document.createElement('section');
          sec.className = 'rep-sec llm';
          sec.innerHTML = `<h3>模型解读 · AI 建议</h3>${llmInner(llm)}`;
          if (!placeholder) root.querySelector('.verdict')?.before(sec);

          btn?.remove();
          toast(out.cached ? '已取回先前的解读' : '解读完成');
        } catch (err) {
          placeholder?.remove();
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'AI 建议 · 仅供娱乐';
          }
          if (err.status === 503) {
            toast('模型未配置：设置 FATETELL_LLM_KEY 后重启服务');
          } else if (!auto) {
            toast(err.message || '模型解读失败');
          }
        }
      };

      btn?.addEventListener('click', () => runLlm(false));

      /* 照片看相：不展示题目，直接出结论 → 自动补一段模型解读 */
      if (rec.meta?.auto && !rec.llm) {
        setTimeout(() => runLlm(true), 350);
      }
    },
  };
}

    mount: async () => {

      try { cats = await api.categories(); } catch { cats = null; }

      if (!c) return;
      intro.textContent = c.intro;

function listHtml(reports) {
  if (!reports.length) {
    return `
      <div class="empty">
        <span class="glyph">簿</span>
        还没有批注。<br>
        从<a href="#/face" style="color:var(--brass-hi)">面相</a>或<a href="#/palm" style="color:var(--brass-hi)">手相</a>开始，第一页就有了。
      </div>`;
  }

  const groups = [];
  for (const r of reports) {
    const last = groups[groups.length - 1];
    if (last && last.date === r.dateLabel) last.items.push(r);
    else groups.push({ date: r.dateLabel, items: [r] });
  }

  return groups.map((g) => `
    <section class="hist-group">
      <div class="hist-date">${esc(g.date)}</div>
      <div class="recent" data-list>
        ${g.items.map((r) => `
          <div class="rec" data-id="${esc(r.id)}">
            <a class="rec-seal" href="#/report/${esc(r.id)}">${esc(r.glyph || '相')}</a>
            <a class="rec-main" href="#/report/${esc(r.id)}">
              <span class="rec-title">${esc(r.title)}</span>
              <span class="rec-meta">${esc(r.level?.name || '')}　${esc((r.traits || []).slice(0, 2).join('、'))}</span>
            </a>
            <span class="rec-score">${r.overall ?? '—'}<small>${r.overall ? '分' : ''}</small></span>
            <button class="rec-del" type="button" data-del="${esc(r.id)}" aria-label="删除这条批注">×</button>
          </div>`).join('')}
      </div>
    </section>`).join('');
}

function historyView() {
  const { reports } = store.get();

  const html = `
    <header class="topbar">
      <a class="brand" href="#/">问鹤</a>
      ${reports.length ? '<button class="tb-link" type="button" data-clear>清空</button>' : '<a class="tb-link" href="#/">回命盘</a>'}
    </header>

    <header class="page-head">
      <a class="back" href="#/" data-back><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>返回</a>
      <h1>我的记录</h1>
      <span></span>
    </header>

    <div data-listwrap>${listHtml(reports)}</div>

    <footer class="foot" data-foot>共 ${reports.length} 页，存在本机浏览器里</footer>`;

  const mount = () => {
    const root = $('#app .view');
    root.addEventListener('click', (e) => {
      const del = e.target.closest('[data-del]');
      if (del) {
        const id = del.dataset.del;
        openSheet(`
          <h2>删掉这页？</h2>
          <p>删除后无法恢复，其余批注不受影响。</p>
          <div class="acts">
            <button class="btn btn-primary" type="button" data-confirm>删除</button>
            <button class="btn btn-ghost" type="button" data-close>保留</button>
          </div>`);
        const confirmBtn = $('[data-confirm]');
        confirmBtn?.addEventListener('click', () => {
          const removed = store.report(id);
          store.remove(id);
          closeSheet();
          const left = store.get().reports;
          const wrap = $('[data-listwrap]', root);
          if (wrap) wrap.innerHTML = listHtml(left);
          const foot = $('[data-foot]', root);
          if (foot) foot.textContent = `共 ${left.length} 页，存在本机浏览器里`;
          if (!left.length) $('[data-clear]', root)?.remove();
          if (removed) {
            toast('已删除这页批注', {
              actionLabel: '撤销',
              onAction: () => {
                store.addReport(removed);
                const back = store.get().reports;
                const w = $('[data-listwrap]', root);
                if (w) w.innerHTML = listHtml(back);
                const f = $('[data-foot]', root);
                if (f) f.textContent = `共 ${back.length} 页，存在本机浏览器里`;
                toast('已恢复');
              },
            });
          }
        });
        return;
      }

      if (e.target.closest('[data-clear]')) {
        openSheet(`
          <h2>清空全部记录？</h2>
          <p>所有记录都会被删除，不能恢复。</p>
          <div class="acts">
            <button class="btn btn-primary" type="button" data-confirm>全部清空</button>
            <button class="btn btn-ghost" type="button" data-close>再想想</button>
          </div>`);
        $('[data-confirm]')?.addEventListener('click', () => {
          store.clearAll();
          closeSheet();
          go('#/');
        });
      }
    });
  };

  return { html, mount };
}

const pickLine = (arr) => arr[Math.floor(Math.random() * arr.length)];

function shell(title, body, dock) {
  return `
    <div class="flow">
      <header class="page-head">
        <a class="back" href="#/" data-back><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>返回</a>

function finish(result, extra) {
  const rec = makeRecord({
    type: result.type,
    title: extra.title,
    heading: extra.heading,
    glyph: extra.glyph,
    overall: extra.overall ?? null,
    level: extra.level ?? null,
    summary: result.summary,
    subtitle: extra.subtitle,
    blocks: extra.blocks,
    citations: result.citations || [],
    advice: extra.advice || [],
    meta: extra.meta || undefined,
    verdict: pickLine(VERDICT[result.type] || VERDICT.bu),
  });
  store.addReport(rec);
  go(`#/report/${rec.id}`);
}

    </div>`;

  return {
    html: shell('起课', `
      <p class="lead">心里想一件事，选好时间，就能起课看眼下顺不顺。</p>

      <div class="field">
        <label for="bq">要问的事</label>
        <input class="input" type="text" id="bq" data-question maxlength="60" placeholder="例如：这次面试能不能过 / 这个月适合搬家吗">
        <p class="q-hint" style="margin-left:0">一事一占，问得越具体越好；同一件事不要反复起课。</p>
        <p class="q-hint" style="margin-left:0">小六壬只断此刻吉凶。若问「哪天合适」，请用 <a href="#/ze" style="color:var(--brass-hi);border-bottom:1px solid var(--brass-soft)">择日</a>。</p>
      </div>

      ${sel('农历月', 'month', 12, now.month)}
      ${sel('农历日', 'day', 30, now.day)}

      <div class="field">
        <label>时辰</label>
        <div class="hour-grid">
          ${HOURS.map((h, i) => `<button class="hour" type="button" data-hi="${i + 1}" aria-pressed="${i + 1 === initHour}">
            <b>${h.label}</b><span>${h.range}</span></button>`).join('')}
        </div>
      </div>

      <div class="cp-actions">
        <button class="btn btn-ghost btn-sm" type="button" data-now>用当前时间</button>
      </div>
      <p class="foot">当前：<span data-now-label>${now.month}月${now.day}日</span>　一事一占，同一件事别反复起课。</p>
    `, '<button class="btn btn-primary" type="button" data-go>起 课</button>'),
    mount: () => {
      const root = $('#app .view');
      let hi = initHour;

      const markHour = () => {
        root.querySelectorAll('[data-hi]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.hi) === hi)));
      };

      const syncNow = () => {
        const p = lunarParts();
        if (!p) {
          toast('当前浏览器不支持农历换算，请手动选择');
          return;
        }
        $('[data-month]', root).value = String(p.month);
        $('[data-day]', root).value = String(p.day);
        hi = zhiIndexNow();
        markHour();
        $('[data-now-label]', root).textContent = `${p.month}月${p.day}日 · ${nowLabel()}`;
        toast('已对齐当前时间');
      };

      root.addEventListener('click', async (e) => {
        const h = e.target.closest('[data-hi]');
        if (h) {
          hi = Number(h.dataset.hi);
          markHour();
          return;
        }
        if (e.target.closest('[data-now]')) {
          syncNow();
          return;
        }
        if (!e.target.closest('[data-go]')) return;

        const question = ($('[data-question]', root)?.value || '').trim();
        if (!question) {
          toast('先写下要问的事');
          $('[data-question]', root)?.focus();
          return;
        }

        const month = Number($('[data-month]', root).value);
        const day = Number($('[data-day]', root).value);
        const btn = $('[data-go]', root);
        btn.disabled = true;
        btn.textContent = '起 课 中';
        try {
          const r = await api.tool('xiaoliuren', { month, day, hourIndex: hi });
          finish(r, {
            title: '起课批注',
            heading: '卜',
            glyph: '卜',
            subtitle: `${question} · ${r.gua.name}`,
            overall: r.overall,
            level: levelOf(r.overall),
            meta: { question },
            blocks: [
              { kind: 'kv', title: '所问', rows: [
                ['问题', question],
                ['起课', `${r.month}月${r.day}日 ${HOURS[hi - 1]?.label || ''}`],
              ] },
              { kind: 'kv', title: '落宫', rows: [['宫位', r.gua.name], ['吉凶', r.gua.luck]] },
              { kind: 'list', title: '起课', items: r.steps.map((s) => `${s.label}：${s.text}`) },
              { kind: 'text', title: '断语', text: r.gua.body },
            ],
            advice: [
              r.gua.luck === '吉' ? '吉课不等于必成，该做的准备一样不能少。' : '凶课不是判决，是提醒你把节奏放慢、把话说清。',
              '所问之事若已过时，就不要再占。',
              '若问的是「具体哪天」，小六壬给不了日期，请到「择日」按事由挑日子。',
            ],
          });
        } catch (err) {
          btn.disabled = false;
          btn.textContent = '起 课';
          toast(err.message.includes('fetch') ? '服务未启动' : err.message);
        }
      });
    },
  };
}

/* ---------------- 择日 ---------------- */
const ZE_GROUPS = [
  { id: 'marry', name: '婚嫁', events: [['marry', '嫁娶订婚'], ['propose', '求婚']] },
  { id: 'move', name: '迁移出行', events: [['move', '入宅搬家'], ['travel', '出行赴任']] },
  { id: 'work', name: '事务', events: [['open', '开业开市'], ['sign', '签约立约'], ['build', '动土装修']] },
  { id: 'care', name: '医疗身后', events: [['medical', '求医问诊'], ['bury', '安葬破土']] },
  { id: 'rite', name: '礼仪学业', events: [['worship', '祭祀祈福'], ['study', '入学考试']] },
];

function zeView() {
  return {
    html: shell('择日', `
      <p class="lead">选要办的事、看多久之内，就能挑出合适的日子。</p>

      <div class="field">
        <label>类别</label>
        <div class="opts" data-zg>
          ${ZE_GROUPS.map((g, i) => `<button class="opt" type="button" data-zgroup="${g.id}" aria-pressed="${i === 0}">${g.name}</button>`).join('')}
        </div>
      </div>

      <div class="field">
        <label>要办的事</label>
        <div class="opts" data-ze>
          ${ZE_GROUPS[0].events.map(([id, name], i) => `<button class="opt" type="button" data-zev="${id}" aria-pressed="${i === 0}">${name}</button>`).join('')}
        </div>
      </div>

      <div class="field">
        <label>看多久之内</label>
        <div class="opts" data-span>
          <button class="opt" type="button" data-days="30" aria-pressed="true">未来 30 天</button>
          <button class="opt" type="button" data-days="60" aria-pressed="false">60 天</button>
          <button class="opt" type="button" data-days="90" aria-pressed="false">90 天</button>
        </div>
      </div>

      <div class="field">
        <label for="zy">主事人出生年（可选，用来避开冲本命）</label>
        <input class="input" type="number" id="zy" inputmode="numeric" min="1900" max="2100" placeholder="例如 1994" data-year>
      </div>

      <p class="foot">建除只论日辰，不代替对具体事项的判断；婚丧嫁娶等大事请结合实际情况。</p>
    `, '<button class="btn btn-primary" type="button" data-go>挑 日 子</button>'),
    mount: () => {
      const root = $('#app .view');
      let event = 'marry';
      let days = 30;

      const paintEvents = (gid) => {
        const g = ZE_GROUPS.find((x) => x.id === gid) || ZE_GROUPS[0];
        $('[data-ze]', root).innerHTML = g.events
          .map(([id, name], i) => `<button class="opt" type="button" data-zev="${id}" aria-pressed="${i === 0}">${name}</button>`)
          .join('');
        event = g.events[0][0];
      };

      root.addEventListener('click', async (e) => {
        const zg = e.target.closest('[data-zgroup]');
        if (zg) {
          root.querySelectorAll('[data-zgroup]').forEach((b) => b.setAttribute('aria-pressed', String(b === zg)));
          paintEvents(zg.dataset.zgroup);
          return;
        }
        const ze = e.target.closest('[data-zev]');
        if (ze) {
          event = ze.dataset.zev;
          root.querySelectorAll('[data-zev]').forEach((b) => b.setAttribute('aria-pressed', String(b === ze)));
          return;
        }
        const sp = e.target.closest('[data-days]');
        if (sp) {
          days = Number(sp.dataset.days);
          root.querySelectorAll('[data-days]').forEach((b) => b.setAttribute('aria-pressed', String(b === sp)));
          return;
        }
        if (!e.target.closest('[data-go]')) return;

        const yearRaw = ($('[data-year]', root).value || '').trim();
        const birthYear = yearRaw ? Number(yearRaw) : undefined;
        if (yearRaw && (!birthYear || birthYear < 1900 || birthYear > 2100)) {
          toast('出生年填 1900–2100');
          return;
        }

        const btn = $('[data-go]', root);
        btn.disabled = true;
        btn.textContent = '挑 日 子 中';
        try {
          const r = await api.tool('zeri', { event, days, birthYear });
          const evName = r.event?.name || '';
          finish(r, {
            title: '择日批注',
            heading: '择日',
            glyph: '择',
            subtitle: `${evName} · ${r.from} 起 ${r.days} 天`,
            blocks: [
              { kind: 'table', title: '可选的日子', head: ['日期', '干支', '吉凶'],
                rows: r.picks.map((x) => [`${x.date.slice(5)} 周${x.weekday}`, x.ganzhi, `${x.jianchu}${x.luck}`]) },
              ...(r.avoid.length ? [{ kind: 'table', title: '避开的日子', head: ['日期', '干支', '原因'],
                rows: r.avoid.map((x) => [`${x.date.slice(5)}`, x.ganzhi, `${x.reasons[0] || '日辰不利'}`]) }] : []),
            ],
            advice: r.advice,
            overall: r.overall,
            level: levelOf(r.overall),
            meta: { event: r.event, days: r.days, birthYear: birthYear || null },
          });
        } catch (err) {
          btn.disabled = false;
          btn.textContent = '挑 日 子';
          toast(err.message.includes('fetch') ? '服务未启动' : err.message);
        }
      });
    },
  };
}


/* ---------------- 合盘 ---------------- */
function hepanView() {
  const hourOpts = HOURS.map((h) => `<option value="${h.v}">${h.label}</option>`).join('');
  const person = (k, label) => `
    <div class="field"><label>${label}生日</label>
      <input class="input" type="date" data-${k}-date max="${today()}" min="1900-01-01"></div>
    <div class="field"><label>${label}时辰</label>
      <select class="input" data-${k}-hour>${hourOpts}</select></div>
    <div class="field"><label>${label}性别</label>
      <select class="input" data-${k}-g><option value="male">男</option><option value="female">女</option></select></div>`;

  return {
    html: shell('合盘', `
      <p class="lead">填两个人的生日与时辰，看日柱冲合、五行互补。</p>
      <h2 class="step"><b>一</b>第一个人</h2>
      ${person('a', '他/她')}
      <h2 class="step"><b>二</b>第二个人</h2>
      ${person('b', '对方')}
      <p class="foot">合盘只看日柱与五行互补，不替代相处与沟通。</p>

        if (!e.target.closest('[data-go]')) return;
        const aDate = $('[data-a-date]', root).value;
        const bDate = $('[data-b-date]', root).value;
