        }
        const g = e.target.closest('[data-gender]');
        if (g) {
          gender = g.dataset.gender;
          root.querySelectorAll('[data-gender]').forEach((b) => b.setAttribute('aria-pressed', String(b === g)));
          return;
        }
        const ex = e.target.closest('[data-example]');
        if (ex) {
          setSolarDate(root, 'md', '1990-06-15');
          clearErr();
          root.querySelector('[data-hour="午"]')?.click();
          root.querySelector('[data-gender="male"]')?.click();
          if (provinceSel) { provinceSel.value = '浙江省'; fillCities('浙江省'); if (citySel) citySel.value = '杭州市'; }
          toast('已填入示例，可按自己的改');
          return;
        }
        if (e.target.closest('[data-go]')) submit();
      });

      const submit = async () => {
        if (quick && !quick.hidden) {
          const parsed = renderQuick();
          if (!parsed.date) {
            qe.textContent = '还差出生日期，例如：1994年8月12日 下午 杭州';
            qe.hidden = false;
            qi.focus();
            return;
          }
          qe.hidden = true;
          applyParsed(parsed);
        }
        const date = cal === 'lunar' ? '' : readSolarDate(root, 'md');
        if (cal === 'solar' && !date) { showErr('请把出生的年、月、日选齐，再点「看命理」'); return; }
        clearErr();
        const btn = $('[data-go]', root);
        btn.disabled = true;
        btn.setAttribute('aria-busy', 'true');
        btn.textContent = '排 盘 中';
        try {
          const province = $('[data-province]', root)?.value || '';
          const city = $('[data-city]', root)?.value || '';
          const lngRaw = ($('[data-lng]', root)?.value || '').trim();
          const lng = lngRaw && Number(lngRaw) >= 73 && Number(lngRaw) <= 135 ? Number(lngRaw) : undefined;
          const payload = cal === 'lunar'
            ? { calendar: 'lunar', lunar: { year: Number($('[data-ly]', root).value), month: Number($('[data-lm]', root).value), day: Number($('[data-ld]', root).value), leap: $('[data-leap]', root).checked }, hour, gender, province, city, longitude: lng, hourUnknown: unknownHour }
            : { date, hour, gender, province, city, longitude: lng, hourUnknown: unknownHour };
          const r = await api.tool('paipan', payload);
          let week = null;
          try { week = await api.tool('daily', { birth: payload, days: 7 }); } catch { week = null; }
          const rows = r.pillars.map((p) => `${p.gan}${p.zhi}`);
          const hiddenRow = (r.deep?.hidden || []).map((h) => h.stems.map((x) => x.gan).join(''));
          const nayinRow = (r.deep?.nayin || []).map((n) => n.name);
          const stageRow = (r.deep?.stages || []).map((x) => x.stage);
          try { localStorage.setItem(LAST_KEY, JSON.stringify({ date, hour, gender, province, city, unknownHour })); } catch {}
          finish(r, {
            title: '命盘批注',
            heading: '命',
            glyph: '命',
            subtitle: rows.join('　'),
            overall: r.overall,
            level: levelOf(r.overall),
            blocks: [
              { kind: 'table', title: '四柱', head: ['', ...r.pillars.map((p) => p.label)], rows: [
                ['干支', ...rows],
                ['十神', ...r.tenGods],
                ['藏干', ...hiddenRow],
                ['纳音', ...nayinRow],
                ['长生', ...stageRow],
              ] },
              { kind: 'elems', title: '五行', items: r.elems },
              { kind: 'kv', title: '判读', rows: [
                ['日主', `${r.dayMaster}${r.dayMasterElem}`],
                ['身强弱', r.strong ? '身旺' : '身弱'],
                ['喜用', r.yong.filter(Boolean).join('、')],
              ] },
              { kind: 'kv', title: '排盘约定', rows: [
                ['历法', r.resolved?.calendar === 'lunar' ? `农历 ${r.resolved.lunar?.year} 年${r.resolved.lunar?.leap ? '闰' : ''}${r.resolved.lunar?.month} 月${r.resolved.lunar?.day} 日 → 公历 ${r.resolved.adjustedDate}` : '公历'],
                ['换年', '立春'],
                ['换日', '23:00 起算子时'],
                ['夏令时', r.resolved?.dstApplied ? '1986–1991 夏令时 · 已减 60 分钟' : '未涉及'],
                ['真太阳时', r.resolved?.trueSolarApplied
                  ? `${r.resolved.city || '东经 ' + r.resolved.longitude} · ${r.resolved.correctionMinutes > 0 ? '+' : ''}${r.resolved.correctionMinutes} 分 · ${r.resolved.inputClock || r.resolved.baseClock}→${r.resolved.correctedClock}`
                  : '未校正（没选出出生地）'],
                ['时辰', `${r.resolved?.hour || hour}时${r.resolved?.hourAssumed ? ' · 不清楚，按正午暂排' : ''}`],
              ] },
              { kind: 'kv', title: '格局', rows: [
                ['格局', r.deep?.pattern?.name || '未取'],
                ['取法', r.deep?.pattern?.note || ''],
              ] },
              { kind: 'kv', title: '神煞', rows: (r.deep?.shensha || []).slice(0, 8).map((x) => [x.name, x.where + (x.basis ? `（${x.basis}）` : '')]) },
              { kind: 'table', title: '流月', head: ['月', '干支', '十神'],
                rows: (r.deep?.months || []).map((m) => [m.label, m.ganZhi, m.tenGod]) },
              ...(week ? [{ kind: 'table', title: '未来七天', head: ['日期', '干支', '十神', '能量'],
                rows: week.days.map((d) => [d.date.slice(5), d.ganzhi, d.tenGod, String(d.energy)]) }] : []),
              { kind: 'kv', title: '起运', rows: [
                ['顺逆', r.luck.forward ? '顺行' : '逆行'],
                ['起运', `${r.luck.startAge.years}岁${r.luck.startAge.months ? `${r.luck.startAge.months}个月` : ''}`],
                ['交运', r.luck.startDate],
              ] },
              { kind: 'table', title: '大运', head: ['大运', '起岁', '十神'],
                rows: r.luck.cycles.map((c) => [c.gan + c.zhi, c.startLabel, c.tenGod]) },
              { kind: 'kv', title: '流年', rows: [
                ['流年', `${r.luck.liunian.year}　${r.luck.liunian.ganZhi}`],
                ['十神', r.luck.liunian.tenGod],
                ['年龄', `${r.luck.liunian.age} 岁`],
                ['所在大运', r.luck.liunian.cycle],
              ] },
              { kind: 'kv', title: '开运（娱乐）', rows: [
                ['颜色', r.fortune.colors],
                ['饮食', r.fortune.foods],
                ['运动', r.fortune.sports],
                ['方位', r.fortune.direction],
                ['城市', r.fortune.cities],
              ] },
              { kind: 'text', title: '说明', text: r.fortune.note },
            ],
            advice: [
              `喜用${r.yong.filter(Boolean).join('、')}：有意识地用这两个方向补，不是改命，是调状态。`,
              `忌一味补${r.dom}：旺处再加，容易过。`,
              `${r.luck.liunian.year} 年流年 ${r.luck.liunian.ganZhi}，落在 ${r.luck.liunian.cycle} 运里；流年只说明引动，不说明结果。`,
              '颜色、饮食、运动、城市按喜用五行推，属娱乐；不是医疗或择业建议，量力而行。',
            ],
          });
        } catch (err) {
          btn.disabled = false;
          btn.removeAttribute('aria-busy');
          btn.textContent = '看 命 理';
          toast(err.message.includes('fetch') ? '服务未启动' : err.message);
        }
      };
    },
  };
}

/* ---------------- 卜 · 小六壬 ---------------- */
function buView() {
  const now = lunarParts() || { month: 1, day: 1 };
  const initHour = zhiIndexNow();

  const sel = (label, name, max, current) => `
    <div class="field">
      <label>${label}</label>
      <select class="input" data-${name}>
        ${Array.from({ length: max }, (_, i) => `<option value="${i + 1}"${i + 1 === current ? ' selected' : ''}>${i + 1}</option>`).join('')}
      </select>
    </div>`;

  return {
    html: shell('起课', `
      <p class="lead lead-compact">想好一件事，选个时间。</p>

      <section class="form-block">
        <h2 class="step"><b>一</b>问什么事</h2>
        <div class="field">
          <label for="bq">要问的事</label>
          <input class="input" type="text" id="bq" data-question maxlength="60" placeholder="例如：这次面试能不能过 / 这个月适合搬家吗">
        </div>
      </section>

      <section class="form-block">
        <h2 class="step"><b>二</b>选个时间</h2>
        ${sel('农历月', 'month', 12, now.month)}
        ${sel('农历日', 'day', 30, now.day)}
        <div class="field">
          <label>时辰</label>
          <div class="hour-grid">
            ${HOURS.map((h, i) => `<button class="hour" type="button" data-hi="${i + 1}" aria-pressed="${i + 1 === initHour}">
              <b>${h.label}</b><span>${h.range}</span></button>`).join('')}
          </div>
        </div>
        <div class="cp-actions">
          <button class="btn btn-ghost btn-sm" type="button" data-now>用当前时间</button>
        </div>
      </section>

      <details class="detail-blocks">
        <summary>起课须知 · 点开看</summary>
        <ul class="rule-list">
          <li>一次只问一件事，问得越具体越好；同一件事别反复起课。</li>
          <li>只看此刻吉凶。想问「哪天合适」，请用 <a href="#/ze">择日</a>。</li>
        </ul>
      </details>

      <p class="foot">当前：<span data-now-label>${now.month}月${now.day}日</span></p>
    `, '<button class="btn btn-primary" type="button" data-go>起 课</button>'),
    mount: () => {
      const root = $('#app .view');
      let hi = initHour;

      const markHour = () => {
        root.querySelectorAll('[data-hi]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.hi) === hi)));
      };

      const syncNow = () => {
        const p = lunarParts();
        if (!p) {
          toast('当前浏览器不支持农历换算，请手动选择');
          return;
        }
        $('[data-month]', root).value = String(p.month);
        $('[data-day]', root).value = String(p.day);
        hi = zhiIndexNow();
        markHour();
        $('[data-now-label]', root).textContent = `${p.month}月${p.day}日 · ${nowLabel()}`;
        toast('已对齐当前时间');
      };

      root.addEventListener('click', async (e) => {
        const h = e.target.closest('[data-hi]');
        if (h) {
          hi = Number(h.dataset.hi);
          markHour();
          return;
        }
        if (e.target.closest('[data-now]')) {
          syncNow();
          return;
        }
        if (!e.target.closest('[data-go]')) return;

        const question = ($('[data-question]', root)?.value || '').trim();
        if (!question) {
          toast('先写下要问的事');
          $('[data-question]', root)?.focus();
          return;
        }

        const month = Number($('[data-month]', root).value);
        const day = Number($('[data-day]', root).value);
        const btn = $('[data-go]', root);
        btn.disabled = true;
        btn.textContent = '起 课 中';
        try {
          const r = await api.tool('xiaoliuren', { month, day, hourIndex: hi });
          finish(r, {
            title: '起课批注',
            heading: '卜',
            glyph: '卜',
            subtitle: `${question} · ${r.gua.name}`,
            overall: r.overall,
            level: levelOf(r.overall),
            meta: { question },
            blocks: [
              { kind: 'kv', title: '所问', rows: [
                ['问题', question],
                ['起课', `${r.month}月${r.day}日 ${HOURS[hi - 1]?.label || ''}`],
              ] },
              { kind: 'kv', title: '落宫', rows: [['宫位', r.gua.name], ['吉凶', r.gua.luck]] },
              { kind: 'list', title: '起课', items: r.steps.map((s) => `${s.label}：${s.text}`) },
              { kind: 'text', title: '断语', text: r.gua.body },
            ],
            advice: [
              r.gua.luck === '吉' ? '吉课不等于必成，该做的准备一样不能少。' : '凶课不是判决，是提醒你把节奏放慢、把话说清。',
              '所问之事若已过时，就不要再占。',
              '若问的是「具体哪天」，小六壬给不了日期，请到「择日」按事由挑日子。',
            ],
          });
        } catch (err) {
          btn.disabled = false;
          btn.textContent = '起 课';
          toast(err.message.includes('fetch') ? '服务未启动' : err.message);
        }
      });
    },
  };
}

/* ---------------- 择日 ---------------- */
const ZE_GROUPS = [
  { id: 'marry', name: '婚嫁', events: [['marry', '嫁娶订婚'], ['propose', '求婚']] },
  { id: 'move', name: '迁移出行', events: [['move', '入宅搬家'], ['travel', '出行赴任']] },
  { id: 'work', name: '事务', events: [['open', '开业开市'], ['sign', '签约立约'], ['build', '动土装修']] },
  { id: 'care', name: '医疗身后', events: [['medical', '求医问诊'], ['bury', '安葬破土']] },
  { id: 'rite', name: '礼仪学业', events: [['worship', '祭祀祈福'], ['study', '入学考试']] },
];

function zeView() {
  return {
    html: shell('择日', `
      <p class="lead">选要办的事、看多久之内，就能挑出合适的日子。</p>

      <div class="field">
        <label>类别</label>
        <div class="opts" data-zg>
          ${ZE_GROUPS.map((g, i) => `<button class="opt" type="button" data-zgroup="${g.id}" aria-pressed="${i === 0}">${g.name}</button>`).join('')}
        </div>
      </div>

      <div class="field">
        <label>要办的事</label>
        <div class="opts" data-ze>
          ${ZE_GROUPS[0].events.map(([id, name], i) => `<button class="opt" type="button" data-zev="${id}" aria-pressed="${i === 0}">${name}</button>`).join('')}
        </div>
      </div>

      <div class="field">
        <label>看多久之内</label>
        <div class="opts" data-span>
          <button class="opt" type="button" data-days="30" aria-pressed="true">未来 30 天</button>
          <button class="opt" type="button" data-days="60" aria-pressed="false">60 天</button>
          <button class="opt" type="button" data-days="90" aria-pressed="false">90 天</button>
        </div>
      </div>

      <div class="field">
        <label for="zy">主事人出生年（可选，用来避开冲本命）</label>
        <input class="input" type="number" id="zy" inputmode="numeric" min="1900" max="2100" placeholder="例如 1994" data-year>
      </div>

      <p class="foot">建除只论日辰，不代替对具体事项的判断；婚丧嫁娶等大事请结合实际情况。</p>
    `, '<button class="btn btn-primary" type="button" data-go>挑 日 子</button>'),
    mount: () => {
      const root = $('#app .view');
      let event = 'marry';
      let days = 30;

      const paintEvents = (gid) => {
        const g = ZE_GROUPS.find((x) => x.id === gid) || ZE_GROUPS[0];
        $('[data-ze]', root).innerHTML = g.events
          .map(([id, name], i) => `<button class="opt" type="button" data-zev="${id}" aria-pressed="${i === 0}">${name}</button>`)
          .join('');
        event = g.events[0][0];
      };

      root.addEventListener('click', async (e) => {
        const zg = e.target.closest('[data-zgroup]');
        if (zg) {
          root.querySelectorAll('[data-zgroup]').forEach((b) => b.setAttribute('aria-pressed', String(b === zg)));
          paintEvents(zg.dataset.zgroup);
          return;
        }
        const ze = e.target.closest('[data-zev]');
        if (ze) {
          event = ze.dataset.zev;
          root.querySelectorAll('[data-zev]').forEach((b) => b.setAttribute('aria-pressed', String(b === ze)));
          return;
        }
        const sp = e.target.closest('[data-days]');
        if (sp) {
          days = Number(sp.dataset.days);
          root.querySelectorAll('[data-days]').forEach((b) => b.setAttribute('aria-pressed', String(b === sp)));
          return;
        }
        if (!e.target.closest('[data-go]')) return;

        const yearRaw = ($('[data-year]', root).value || '').trim();
        const birthYear = yearRaw ? Number(yearRaw) : undefined;
        if (yearRaw && (!birthYear || birthYear < 1900 || birthYear > 2100)) {
          toast('出生年填 1900–2100');
          return;
        }

        const btn = $('[data-go]', root);
        btn.disabled = true;
        btn.textContent = '挑 日 子 中';
        try {
          const r = await api.tool('zeri', { event, days, birthYear });
          const evName = r.event?.name || '';
          finish(r, {
            title: '择日批注',
            heading: '择日',
            glyph: '择',
            subtitle: `${evName} · ${r.from} 起 ${r.days} 天`,
            blocks: [
              { kind: 'table', title: '可选的日子', head: ['日期', '干支', '吉凶'],
                rows: r.picks.map((x) => [`${x.date.slice(5)} 周${x.weekday}`, x.ganzhi, `${x.jianchu}${x.luck}`]) },
              ...(r.avoid.length ? [{ kind: 'table', title: '避开的日子', head: ['日期', '干支', '原因'],
                rows: r.avoid.map((x) => [`${x.date.slice(5)}`, x.ganzhi, `${x.reasons[0] || '日辰不利'}`]) }] : []),
            ],
            advice: r.advice,
            overall: r.overall,
            level: levelOf(r.overall),
            meta: { event: r.event, days: r.days, birthYear: birthYear || null },
          });
        } catch (err) {
          btn.disabled = false;
          btn.textContent = '挑 日 子';
          toast(err.message.includes('fetch') ? '服务未启动' : err.message);
        }
      });
    },
  };
}


/* ---------------- 合盘 ---------------- */
function hepanView() {
  const hourOpts = HOURS.map((h) => `<option value="${h.v}">${h.label}</option>`).join('')
    + '<option value="unknown" selected>不清楚（按正午）</option>';
  const person = (k) => `
    <div class="field"><label>出生那天</label>
      ${solarDateHTML(k)}</div>
    <div class="field"><label>时辰</label>
      <select class="input" data-${k}-hour>${hourOpts}</select></div>
    <div class="field"><label>性别</label>
      <select class="input" data-${k}-g><option value="male">男</option><option value="female">女</option></select></div>`;

  return {
    html: shell('合盘', `
      <div class="seg">
        <a class="seg-item" href="#/ming">看我自己</a>
        <a class="seg-item is-on" href="#/hepan">看两人合不合</a>
      </div>
      <p class="lead">填两个人的生日与时辰，看日柱冲合、五行互补。可以给两人填个称呼，报告里就好认。时辰不清楚就选「不清楚」，按正午算。</p>
      <h2 class="step"><b>一</b><span data-role-title="a">你</span></h2>
      <div class="field"><label>称呼（选填）</label>
        <input class="input" type="text" data-a-name maxlength="10" placeholder="你" autocomplete="off"></div>
      ${person('a')}
      <h2 class="step"><b>二</b><span data-role-title="b">对方</span></h2>
      <div class="field"><label>称呼（选填）</label>
        <input class="input" type="text" data-b-name maxlength="10" placeholder="对方" autocomplete="off"></div>
      ${person('b')}
      <p class="foot">合盘只看日柱与五行互补，不替代相处与沟通。</p>
    `, '<button class="btn btn-primary" type="button" data-go>看 合 盘</button>'),
    mount: () => {
      const root = $('#app .view');
      // 称呼实时联动标题；留空回落到默认称呼
      const nameOf = (k, fallback) => ($(`[data-${k}-name]`, root).value || '').trim() || fallback;
      [['a', '你'], ['b', '对方']].forEach(([k, fallback]) => {
        $(`[data-${k}-name]`, root).addEventListener('input', (e) => {
          $(`[data-role-title="${k}"]`, root).textContent = e.target.value.trim() || fallback;
        });
      });
      root.addEventListener('click', async (e) => {
        if (!e.target.closest('[data-go]')) return;
        const aDate = readSolarDate(root, 'a');
        const bDate = readSolarDate(root, 'b');
        if (!aDate || !bDate) return toast('两个人的出生年、月、日都要选齐');
        const nameA = nameOf('a', '你');
        const nameB = nameOf('b', '对方');
        const btn = $('[data-go]', root);
        btn.disabled = true;
        btn.textContent = '合 盘 中';
        try {
          const pickHour = (v) => (v === 'unknown' ? '午' : v);
          const a = { date: aDate, hour: pickHour($('[data-a-hour]', root).value), gender: $('[data-a-g]', root).value };
          const b = { date: bDate, hour: pickHour($('[data-b-hour]', root).value), gender: $('[data-b-g]', root).value };
          const r = await api.tool('hepan', { a, b });
          const pa = r.a.pillars.map((x) => x.gan + x.zhi).join(' ');
          const pb = r.b.pillars.map((x) => x.gan + x.zhi).join(' ');
          finish(r, {
            title: '合盘批注',
            heading: '合盘',
            glyph: '合',
            subtitle: `${nameA}（${pa}）　×　${nameB}（${pb}）`,
            overall: r.overall,
            level: levelOf(r.overall),
            blocks: [
              { kind: 'table', title: '双方四柱', head: ['', nameA, nameB], rows: [
                ['四柱', pa, pb],
                ['日主', r.a.dayMaster, r.b.dayMaster],
                ['喜用', r.a.yong.filter(Boolean).join('、'), r.b.yong.filter(Boolean).join('、')],
              ] },
              { kind: 'kv', title: '关系', rows: r.relations.length ? r.relations.map((x) => [x.type, x.text]) : [['日柱', '无直接冲合']] },

        </div>

        <div class="cp-actions">

    mount: () => {

      const stage = $('[data-stage]', root);
      const needle = $('#cpNeedle', root);
      const readout = $('[data-readout]', root);
      const dirEl = $('[data-dir]', root);
      const degEl = $('[data-deg]', root);
      const hint = $('[data-hint]', root);
      const btn = $('[data-go]', root);

      let lai = '';
      let qu = '';
      let loc = null;
      let stopSensor = null;
      const t = { backing: false, mingtang: false, shaq: false };

      const cleanup = () => {
        if (stopSensor) {
          stopSensor();
          stopSensor = null;
        }
      };
      // 离开页面时停指南针：用自定义事件而非 hashchange，受限面板里地址栏不变也能清理
      window.addEventListener('ft:leave', cleanup, { once: true });

      const paint = () => {
        const facing = mountainAt(heading);
        const sitting = mountainAt(heading + 180);
        needle.setAttribute('transform', `rotate(${norm360(heading).toFixed(1)} 160 160)`);
        readout.textContent = `朝向 ${Math.round(norm360(heading))}° · ${facing.gua}卦 · ${GUAS[facing.gua].dir}`;
        dirEl.innerHTML = `坐 <span>${sitting.n}</span> 向 ${facing.n}`;
        degEl.textContent = `${Math.round(norm360(heading))}°`;

          const d = Number(el.dataset.deg);
          el.classList.toggle('hot', d === facing.deg || d === sitting.deg);

      const angleAt = (e) => {
        const r = stage.getBoundingClientRect();
        const x = e.clientX - (r.left + r.width / 2);
        const y = e.clientY - (r.top + r.height / 2);
        return (Math.atan2(x, -y) * 180) / Math.PI;
      };
      let dragging = false;
      let startAngle = 0;
      let startHeading = 0;

      stage.addEventListener('pointerdown', (e) => {
        if (stopSensor) return;
        dragging = true;
        startAngle = angleAt(e);
        startHeading = heading;
        stage.setPointerCapture?.(e.pointerId);
        hint.textContent = '转到想要的坐向，松手即定';
      });
      stage.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        heading = startHeading + (angleAt(e) - startAngle);
        paint();
      });
      const stop = () => {
        if (!dragging) return;
        dragging = false;
        heading = Math.round(norm360(heading));

      paint();

          return;

          tg.setAttribute('aria-pressed', String(t[k]));
          return;

        if (e.target.closest('[data-go]')) submit();
      });

      const submit = async () => {
        btn.disabled = true;

        try {
          const r = await api.tool('yinzha', {

          finish(r, {
            title: '阴宅批注',

let lastHash = null;
let lastAt = 0;
/* 当前实际渲染的路由：内嵌面板常锁住 location.hash，返回判断不能依赖地址栏 */
let currentRoute = '#/';

/* 站内足迹：返回时回到上一级，而不是一律回首页 */
let trail = (() => {
  try {
    const raw = JSON.parse(sessionStorage.getItem('ft.trail') || '[]');
    return Array.isArray(raw) ? raw.filter((x) => typeof x === 'string' && x.startsWith('#/')) : [];
  } catch { return []; }
})();

function remember(hash) {
  if (!hash.startsWith('#/')) return;
  if (trail[trail.length - 1] === hash) return;
  trail.push(hash);
  if (trail.length > 30) trail.shift();
  try { sessionStorage.setItem('ft.trail', JSON.stringify(trail)); } catch { /* 隐私模式 */ }
}

window.__back = (fallback = '#/') => {
  trail.pop();
  const prev = trail[trail.length - 1];
  try { sessionStorage.setItem('ft.trail', JSON.stringify(trail)); } catch { /* ignore */ }
  go(prev || fallback);
};

function renderPage(target) {
  const hash = (typeof target === 'string' && target) ? target : (location.hash || '#/');
  const app = $('#app');
  const now = Date.now();
  // 同一次跳转可能被 hashchange 与兜底逻辑各触发一次，去重
  if (hash === lastHash && now - lastAt < 150) return;
  lastHash = hash;
  lastAt = now;
  currentRoute = hash;
  remember(hash);


  // 换页时关掉可能残留的弹层，避免遮住新页面
  const layer = $('#layer');
  if (layer && layer.classList.contains('on')) {
    layer.classList.remove('on');
    layer.innerHTML = '';
  }
  // 通知当前页做资源清理（指南针传感器等）。不依赖 hashchange，受限面板同样生效。
  try { window.dispatchEvent(new Event('ft:leave')); } catch { /* 老浏览器 */ }

  let matched = null;
  for (const r of routes) {
    const m = hash.match(r.re);
    if (m) { matched = { route: r, args: r.params ? r.params(m) : [] }; break; }
  }
  if (!matched) {
    if (hash && hash !== '#' && hash !== '#/') {
      console.warn('[fatetell] 未匹配的路由：', hash);
      matched = { route: { view: notFoundView, title: '未找到 · 问鹤' }, args: [] };
    } else {
      matched = { route: routes[0], args: [] };
    }
  }

  const { html, mount: after } = matched.route.view(...matched.args);
  document.title = matched.route.title;
  app.innerHTML = `<div class="view" role="main">${html}</div>`;
  after?.();
  window.scrollTo(0, 0);
  upgradeChoices(app);
  if (store.takeTrimNotice()) toast('批注簿最多存 24 页，最旧的一页已移出', { ms: 4000 });
  installFrame();
  track('view', { path: hash });
}

/* 渲染失败时给出可见提示，不让页面变成一片黑 */
function mount(target) {
  try {
    renderPage(target);
  } catch (err) {
    console.error('[fatetell] 渲染失败', err);
    const app = $('#app');
    if (app) {
      app.innerHTML = `<div class="empty"><span class="glyph">错</span>页面渲染失败：${esc(err.message || String(err))}<br>刷新一次；仍不行就把这句发我。</div>`;
    }
  }
}

/* 给 ui.go() 用：受限面板里 location 不能改，也能跳 */
window.__route = mount;

/* 点击后同步单选状态（视图仍维护 aria-pressed，样式不动） */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[role="radio"]');
  if (!btn) return;
  const g = btn.closest('[role="radiogroup"]');
  if (!g) return;
  g.querySelectorAll('[role="radio"]').forEach((x) => {
    const on = x === btn;
    x.setAttribute('aria-checked', String(on));
    x.tabIndex = on ? 0 : -1;
  });
});

window.addEventListener('hashchange', () => mount());
window.addEventListener('popstate', () => mount());

/* 返回哪一级：按页面层级，不走浏览历史，避免在多个结果页之间来回跳 */
const parentFor = (hash) => {
  const h = String(hash || '');
  const map = {
    '#/ming': '#/', '#/bu': '#/', '#/ze': '#/', '#/hepan': '#/',
    '#/history': '#/', '#/about': '#/', '#/library': '#/',
    '#/combo': '#/c/xiang', '#/face': '#/c/xiang', '#/palm': '#/c/xiang',
    '#/compass': '#/c/kan', '#/yinzha': '#/c/kan',
  };
  if (map[h]) return map[h];
  if (/^#\/c\//.test(h)) return '#/';
  return '#/';
};

/* 自己接管站内跳转：内嵌预览面板常禁用链接默认行为，甚至锁住 location，
   所以不让跳转依赖浏览器，直接按目标 hash 重挂。 */
document.addEventListener('click', (e) => {
  const back = e.target.closest('[data-back]');
  if (back) {
    e.preventDefault();
    const target = back.getAttribute('data-parent') || parentFor(currentRoute);
    go(target || back.getAttribute('data-fallback') || '#/');
    return;
  }

  const submit = e.target.closest('[data-go],[data-submit]');
  if (submit) {
    const label = (submit.textContent || '').trim().replace(/\s+/g, '').slice(0, 12);
    track('click', { name: `${location.hash || '#/'} · ${label || '提交'}` });
  }

  const a = e.target.closest('a[href^="#/"]');
  if (!a) return;
  const href = a.getAttribute('href');
  e.preventDefault();

  const label = (a.querySelector('.gate-name')?.textContent || a.querySelector('.method-name')?.textContent || '')
    .trim().replace(/\s+/g, '').slice(0, 24);
  track('click', { name: label ? `入口:${label}` : `链接:${href}` });

  try { location.hash = href; } catch { /* 面板限制时忽略 */ }
  mount(href);
});

/* 开屏：每个标签页会话只播一次；地址带 ?splash=1 可强制重播，方便随时查看 */
function playSplash() {
  const s = document.getElementById('splash');
  if (!s) return;
  const force = new URLSearchParams(location.search).get('splash') === '1';
  let seen = false;
  try { seen = sessionStorage.getItem('ft.splash.seen') === '1'; } catch { /* 隐私模式 */ }
  const finish = () => {
    s.classList.add('splash-out');
    setTimeout(() => { s.remove(); }, 520);
  };
  if (seen && !force) { s.remove(); return; }
  try { sessionStorage.setItem('ft.splash.seen', '1'); } catch { /* ignore */ }
  // 1.65s 主体动画（墨鹤晕开→字标→朱砂落款）+ 0.75s 停留，再淡出
  setTimeout(finish, 2400);
  // 用户提前点击/按键可跳过
  s.addEventListener('click', finish, { once: true });
}

if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', () => { mount(); maybeWechatHint(); playSplash(); });
} else {
  mount();
  maybeWechatHint();
  playSplash();
}

/* 键盘：Esc 关闭弹层 */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const layer = $('#layer');
    if (layer && layer.classList.contains('on')) {
      layer.classList.remove('on');
      setTimeout(() => { layer.innerHTML = ''; }, 380);
    }
  }
});

          lunarMonth = m.getMonth();
          lunarDay = days + 1;

      var om = lunarMonth;
      var od = lunarDay;
      var oh = hour;
      var oi = minute;
      var os = second;
      lunarYear *= 1;
      if(isNaN(lunarYear)){
        throw new Error('wrong lunar year '+oy);
      }
      lunarMonth *= 1;
      if(isNaN(lunarMonth)){
        throw new Error('wrong lunar month '+om);
      }
      lunarDay *= 1;
      if(isNaN(lunarDay)){
        throw new Error('wrong lunar day '+od);
      }
      hour *= 1;
      if(isNaN(hour)){
        throw new Error('wrong hour '+oh);
      }
      minute *= 1;
      if(isNaN(minute)){
        throw new Error('wrong minute '+oi);
      }
      second *= 1;
      if(isNaN(second)){
        throw new Error('wrong second '+os);
      }
      if(hour<0||hour>23){
        throw new Error('wrong hour '+hour);
      }
      if(minute<0||minute>59){
        throw new Error('wrong minute '+minute);
      }
      if(second<0||second>59){
        throw new Error('wrong second '+second);
      }
      var y = LunarYear.fromYear(lunarYear);
      var m = y.getMonth(lunarMonth);
      if (null == m) {
        throw new Error('wrong lunar year '+lunarYear+' month '+lunarMonth);

      if (lunarDay < 1) {

        _getYearNineStar:function(yearInGanZhi){

          var yearOffset = indexExact - index;

            yearOffset -= 60;
          } else if (yearOffset < -1) {
            yearOffset += 60;
          }
          var yuan = Math.floor((this._p.year + yearOffset + 2696) / 60) % 3;
          var offset = (62 + yuan * 3 - indexExact) % 9;
          if(0 === offset){
            offset = 9;

          return NineStar.fromIndex(offset - 1);

        getYearNineStar:function(sect){

              yearInGanZhi = this.getYearInGanZhiExact();

            default:

        getMonthNineStar:function(sect){
          var yearZhiIndex;
          var monthZhiIndex;
          switch (sect) {
            case 1:
              yearZhiIndex = this._p.yearZhiIndex;
              monthZhiIndex = this._p.monthZhiIndex;
              break;
            case 3:
              yearZhiIndex = this._p.yearZhiIndexExact;
              monthZhiIndex = this._p.monthZhiIndexExact;
              break;
            default:
              yearZhiIndex = this._p.yearZhiIndexByLiChun;
              monthZhiIndex = this._p.monthZhiIndex;
          }
          var n = 27 - (yearZhiIndex % 3 * 3);
          if (monthZhiIndex < LunarUtil.BASE_MONTH_ZHI_INDEX) {
            n -= 3;
          }
          return NineStar.fromIndex((n - monthZhiIndex) % 9);

        getDayNineStar:function(){
          var solarYmd = this._p.solar.toYmd();
          var dongZhi = this._getJieQiSolar(I18n.getMessage('jq.dongZhi'));
          var dongZhi2 = this._getJieQiSolar('DONG_ZHI');
          var xiaZhi = this._getJieQiSolar(I18n.getMessage('jq.xiaZhi'));
          var dongZhiIndex = LunarUtil.getJiaZiIndex(dongZhi.getLunar().getDayInGanZhi());
          var dongZhiIndex2 = LunarUtil.getJiaZiIndex(dongZhi2.getLunar().getDayInGanZhi());
          var xiaZhiIndex = LunarUtil.getJiaZiIndex(xiaZhi.getLunar().getDayInGanZhi());
          var solarShunBai;
          var solarShunBai2;
          var solarNiZi;
          if (dongZhiIndex>29) {
            solarShunBai = dongZhi.next(60 - dongZhiIndex);
          } else {
            solarShunBai = dongZhi.next(-dongZhiIndex);
          }
          var solarShunBaiYmd = solarShunBai.toYmd();
          if (dongZhiIndex2>29) {
            solarShunBai2 = dongZhi2.next(60 - dongZhiIndex2);
          } else {
            solarShunBai2 = dongZhi2.next(-dongZhiIndex2);
          }
          var solarShunBaiYmd2 = solarShunBai2.toYmd();
          if (xiaZhiIndex>29) {
            solarNiZi = xiaZhi.next(60 - xiaZhiIndex);
          } else {
            solarNiZi = xiaZhi.next(-xiaZhiIndex);
          }
          var solarNiZiYmd = solarNiZi.toYmd();
          var offset = 0;
          if (solarYmd >= solarShunBaiYmd && solarYmd < solarNiZiYmd) {
            offset = this._p.solar.subtract(solarShunBai) % 9;
          } else if (solarYmd >= solarNiZiYmd && solarYmd < solarShunBaiYmd2){
            offset = 8 - (this._p.solar.subtract(solarNiZi) % 9);
          } else if (solarYmd >= solarShunBaiYmd2) {
            offset = this._p.solar.subtract(solarShunBai2) % 9;
          } else if (solarYmd < solarShunBaiYmd) {
            offset = (8 + solarShunBai.subtract(this._p.solar)) % 9;
          }
          return NineStar.fromIndex(offset);

        getTimeNineStar:function(){

        _buildJieQi:function(name, solar){
          var jie=false;
          var qi=false;
          for(var i=0,j=LunarUtil.JIE_QI.length;i<j;i++){
            if(LunarUtil.JIE_QI[i]===name){
              if(i%2===0){
                qi = true;
              }else{
                jie = true;
              }
              break;
            }
          }
          return {
            _p: {
              name: name,
              solar: solar,
              jie: jie,
              qi: qi
            },

        _getNearJieQi:function(forward, conditions, wholeDay){
          var name = null;
          var near = null;
          var filters = {};
          var filter = false;
          if(null!=conditions){
            for(var i=0,j=conditions.length;i<j;i++){
              filters[conditions[i]] = true;
              filter = true;
            }
          }
          var today = this._p.solar[wholeDay ? 'toYmd' : 'toYmdHms']();
          for(var key in this._p.jieQi){
            var jq = this._convertJieQi(key);
            if(filter){
              if(!filters[jq]){
                continue;
              }
            }
            var solar = this._getJieQiSolar(key);
            var day = solar[wholeDay ? 'toYmd' : 'toYmdHms']();
            if(forward){
              if(day<=today){
                continue;
              }
              if(null == near || day < near[wholeDay ? 'toYmd' : 'toYmdHms']()){
                name = jq;
                near = solar;
              }
            }else{
              if(day>today){
                continue;
              }
              if(null == near || day > near[wholeDay ? 'toYmd' : 'toYmdHms']()) {
                name = jq;
                near = solar;
              }
            }
          }
          if(null==near){
            return null;
          }
          return this._buildJieQi(name, near);

      XIU_SONG:{
        '{xx.jiao}': '角星造作主荣昌，外进田财及女郎，嫁娶婚姻出贵子，文人及第见君王，惟有埋葬不可用，三年之后主瘟疫，起工修筑坟基地，堂前立见主人凶。',
        '{xx.kang}': '亢星造作长房当，十日之中主有殃，田地消磨官失职，接运定是虎狼伤，嫁娶婚姻用此日，儿孙新妇守空房，埋葬若还用此日，当时害祸主重伤。',
        '{xx.di}': '氐星造作主灾凶，费尽田园仓库空，埋葬不可用此日，悬绳吊颈祸重重，若是婚姻离别散，夜招浪子入房中，行船必定遭沉没，更生聋哑子孙穷。',
        '{xx.fang}': '房星造作田园进，钱财牛马遍山岗，更招外处田庄宅，荣华富贵福禄康，埋葬若然用此日，高官进职拜君王，嫁娶嫦娥至月殿，三年抱子至朝堂。',
        '{xx.xin}': '心星造作大为凶，更遭刑讼狱囚中，忤逆官非宅产退，埋葬卒暴死相从，婚姻若是用此日，子死儿亡泪满胸，三年之内连遭祸，事事教君没始终。',
        '{xx.tail}': '尾星造作主天恩，富贵荣华福禄增，招财进宝兴家宅，和合婚姻贵子孙，埋葬若能依此日，男清女正子孙兴，开门放水招田宅，代代公侯远播名。',
        '{xx.ji}': '箕星造作主高强，岁岁年年大吉昌，埋葬修坟大吉利，田蚕牛马遍山岗，开门放水招田宅，箧满金银谷满仓，福荫高官加禄位，六亲丰禄乐安康。',
        '{xx.dou}': '斗星造作主招财，文武官员位鼎台，田宅家财千万进，坟堂修筑贵富来，开门放水招牛马，旺蚕男女主和谐，遇此吉宿来照护，时支福庆永无灾。',
        '{xx.niu}': '牛星造作主灾危，九横三灾不可推，家宅不安人口退，田蚕不利主人衰，嫁娶婚姻皆自损，金银财谷渐无之，若是开门并放水，牛猪羊马亦伤悲。',
        '{xx.nv}': '女星造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。',
        '{xx.xu}': '虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。',
        '{xx.wei}': '危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。',
        '{xx.shi}': '室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。',
        '{xx.qiang}': '壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。',
        '{xx.kui}': '奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。',
        '{xx.lou}': '娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。',
        '{xx.vei}': '胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。',
        '{xx.mao}': '昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。',
        '{xx.bi}': '毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。',
        '{xx.zi}': '觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。',
        '{xx.can}': '参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。',
        '{xx.jing}': '井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。',
        '{xx.gui}': '鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。',
        '{xx.liu}': '柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。',
        '{xx.xing}': '星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。',
        '{xx.zhang}': '张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。',
        '{xx.yi}': '翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。',
        '{xx.zhen}': '轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。'

function dayGanzhi(y, m, d) {
  const days = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(2000, 0, 1)) / 86400000);
  const idx = (((54 + days) % 60) + 60) % 60;
  return { idx, gan: GAN[idx % 10], zhi: ZHI[idx % 12] };

function solarLongitude(jd) {
  const T = (jd - 2451545.0) / 36525;
  const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  const M = ((357.52911 + 35999.05029 * T - 0.0001537 * T * T) * Math.PI) / 180;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M)
    + (0.019993 - 0.000101 * T) * Math.sin(2 * M)
    + 0.000289 * Math.sin(3 * M);
  const omega = ((125.04 - 1934.136 * T) * Math.PI) / 180;
  return ((L0 + C - 0.00569 - 0.00478 * Math.sin(omega)) % 360 + 360) % 360;
}

function termJD(year, t) {
  const approx = Date.UTC(year, t.m - 1, t.d) / 86400000 + 2440587.5;
  let lo = approx - 9;
  let hi = approx + 9;
  const diff = (jd) => {
    let d = solarLongitude(jd) - t.deg;
    while (d > 180) d -= 360;
    while (d < -180) d += 360;
    return d;
  };
  if (diff(lo) > 0 || diff(hi) < 0) return approx; // 极端兜底
  for (let i = 0; i < 48; i++) {
    const mid = (lo + hi) / 2;
    if (diff(mid) < 0) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

function monthZhiOf(y, m, d, minuteOfDay = 720) {
  const t = Date.UTC(y, m - 1, d) + (minuteOfDay - 480) * 60000;
  let bestMs = null;
  let bestZhi = null;
  for (const yy of [y - 1, y]) {
    const row = JIEQI[yy];
    if (!row) continue;
    for (const [name, iso] of Object.entries(row)) {
      const ms = Date.parse(iso);
      if (ms <= t && (bestMs === null || ms > bestMs)) {
        bestMs = ms;
        bestZhi = TERM_ZHI[name];
      }
    }
  }
  if (bestZhi !== null) return bestZhi;
  const birthJD = t / 86400000 + 2440587.5;
  const all = [...termsOf(y - 1), ...termsOf(y), ...termsOf(y + 1)].sort((a, b) => a.jd - b.jd);
  const prev = all.filter((x) => x.jd <= birthJD).pop();
  return prev ? prev.zhi : 0;
}

/* 年柱以立春为界（按精确立春时刻） */
function yearOf(y, m, d, minuteOfDay = 720) {
  const t = Date.UTC(y, m - 1, d) + (minuteOfDay - 480) * 60000;
  const lichun = termMs(y, '立春');
  if (lichun !== null) return t < lichun ? y - 1 : y;
  const birthJD = t / 86400000 + 2440587.5;
  return birthJD < termsOf(y)[1].jd ? y - 1 : y;
}

const SHISHEN = {
  // 同我、我生、我克、克我、生我
  同我: ['比肩', '劫财'],
  我生: ['食神', '伤官'],
  我克: ['偏财', '正财'],
  克我: ['七杀', '正官'],
  生我: ['偏印', '正印'],
};
const ELEM_ORDER = ['木', '火', '土', '金', '水'];
const SHENG = { 木: '火', 火: '土', 土: '金', 金: '水', 水: '木' };
const KE = { 木: '土', 火: '金', 土: '水', 金: '木', 水: '火' };

function shishen(dayGan, otherGan) {
  const me = GAN_E[GAN.indexOf(dayGan)];
  const he = GAN_E[GAN.indexOf(otherGan)];
  let rel;
  if (he === me) rel = '同我';
  else if (SHENG[me] === he) rel = '我生';
  else if (KE[me] === he) rel = '我克';
  else if (KE[he] === me) rel = '克我';
  else rel = '生我';
  const sameYinYang = (GAN.indexOf(dayGan) % 2) === (GAN.indexOf(otherGan) % 2);
  return SHISHEN[rel][sameYinYang ? 0 : 1];
}

function paipan({ date, hour = '午', gender = 'male', clock, city, province, longitude, hourUnknown = false, calendar = 'solar', lunar = null }) {
  let lunarConverted = false;
  let lunarInfo = null;
  if (calendar === 'lunar') {
    if (!lunar) throw new Error('农历输入需要 lunar: { year, month, day, leap }');
    const c = lunarToSolar(lunar.year, lunar.month, lunar.day, Boolean(lunar.leap));
    date = c.date;
    lunarConverted = true;
    lunarInfo = { year: Number(lunar.year), month: Number(lunar.month), day: Number(lunar.day), leap: Boolean(lunar.leap) };
  }

  let [y, m, d] = String(date).split('-').map(Number);
  if (!y || !m || !d) throw new Error('date 需要 YYYY-MM-DD');

  const lng = Number.isFinite(Number(longitude)) && longitude !== undefined
    ? Number(longitude)
    : (cityByName(city, province)?.lng ?? null);

  /* 起算时刻：有钟点用钟点；时辰未知用正午；否则取所报时辰的中点 */
  let baseMinutes = null;
  if (typeof clock === 'string' && toMinutes(clock) !== null) baseMinutes = toMinutes(clock);
  else if (hourUnknown) baseMinutes = 12 * 60;
  else baseMinutes = midMinutesOfZhi(hour);
  if (baseMinutes === null) throw new Error('hour 需要地支');

  const inputMinutes = baseMinutes;

  /* 1986–1991 夏令时：当时钟表快 1 小时，先减回标准时间 */
  const dstApplied = inChinaDST(y, m, d);
  if (dstApplied) baseMinutes -= 60;

  const correction = lng === null ? 0 : solarCorrection(y, m, d, lng);
  const adjMinutes = Math.round(baseMinutes + correction);
  const { clock: correctedClock, dayShift } = fromMinutes(adjMinutes);

  if (dayShift !== 0) {
    const shifted = new Date(Date.UTC(y, m - 1, d + dayShift));
    y = shifted.getUTCFullYear();
    m = shifted.getUTCMonth() + 1;
    d = shifted.getUTCDate();
  }

  const effectiveHour = zhiOfMinutes(adjMinutes);
  const hZhiIdx = ZHI.indexOf(effectiveHour);
  if (hZhiIdx < 0) throw new Error('hour 需要地支');
  const hourMid = Math.floor((((adjMinutes % 1440) + 1440) % 1440) / 60);

  const notes = [];
  if (lunarConverted) notes.push('lunar_converted');
  if (dstApplied) notes.push('china_dst_applied');
  if (hourUnknown) notes.push('hour_assumed');
  if (lng === null) notes.push('true_solar_skipped_no_longitude');
  else notes.push('true_solar_applied');

  const resolved = {
    calendar: lunarConverted ? 'lunar' : 'solar',
    lunar: lunarInfo,
    dstApplied,
    inputClock: fromMinutes(inputMinutes).clock,
    city: city || null,
    province: province || null,
    longitude: lng,
    baseClock: `${String(Math.floor(baseMinutes / 60)).padStart(2, '0')}:${String(baseMinutes % 60).padStart(2, '0')}`,
    correctedClock,
    correctionMinutes: Number(correction.toFixed(1)),
    adjustedDate: `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`,
    hour: effectiveHour,
    hourAssumed: Boolean(hourUnknown),
    trueSolarApplied: lng !== null,
    notes,
  };

  const minuteOfDay = ((adjMinutes % 1440) + 1440) % 1440;
  const bYear = yearOf(y, m, d, minuteOfDay);
  const yGanIdx = ((bYear - 4) % 10 + 10) % 10;
  const yZhiIdx = ((bYear - 4) % 12 + 12) % 12;
  const mZhiIdx = monthZhiOf(y, m, d, minuteOfDay);
  const mGanIdx = (yGanIdx * 2 + 2 + ((mZhiIdx - 2 + 12) % 12)) % 10;
  /* 23:00 起算子时：晚子时按次日日柱（sect 2），与 conventions.hourBoundary 一致 */
  let dayY = y;
  let dayM = m;
  let dayD = d;
  if (hourMid >= 23) {
    const nx = new Date(Date.UTC(y, m - 1, d + 1));
    dayY = nx.getUTCFullYear();
    dayM = nx.getUTCMonth() + 1;
    dayD = nx.getUTCDate();
  }
  const day = dayGanzhi(dayY, dayM, dayD);
  const hGanIdx = ((day.idx % 10) % 5 * 2 + hZhiIdx) % 10;

  const pillars = [
    { label: '年柱', gan: GAN[yGanIdx], zhi: ZHI[yZhiIdx] },
    { label: '月柱', gan: GAN[mGanIdx], zhi: ZHI[mZhiIdx] },
    { label: '日柱', gan: day.gan, zhi: day.zhi },
    { label: '时柱', gan: GAN[hGanIdx], zhi: ZHI[hZhiIdx] },
  ];

  const weights = { 木: 0, 火: 0, 土: 0, 金: 0, 水: 0 };
  pillars.forEach((p, i) => {
    const w = i === 2 ? 1.2 : 1; // 日干为主
    weights[GAN_E[GAN.indexOf(p.gan)]] += w;
    weights[ZHI_E[ZHI.indexOf(p.zhi)]] += w * 1.1;
  });
  const total = Object.values(weights).reduce((a, b) => a + b, 0);
  const elems = ELEM_ORDER.map((e) => ({ e, v: Math.round((weights[e] / total) * 100) }));
  const diff = 100 - elems.reduce((s, x) => s + x.v, 0);
  elems.reduce((m2, x) => (x.v > m2.v ? x : m2), elems[0]).v += diff;
  const dom = [...elems].sort((a, b) => b.v - a.v)[0].e;
  const weak = [...elems].sort((a, b) => a.v - b.v)[0].e;

  const tenGods = pillars.map((p) => (p === pillars[2] ? '日主' : shishen(day.gan, p.gan)));
  const deep = deepen(pillars, day.gan, pillars[0].gan);
  const me = GAN_E[GAN.indexOf(day.gan)];
  const same = elems.find((x) => x.e === me)?.v || 0;
  const support = elems.find((x) => x.e === Object.keys(SHENG).find((k) => SHENG[k] === me))?.v || 0;

  const strong = same + support * 0.8 >= 45;
  const yong = strong ? [KE[me], SHENG[me]] : [me, Object.keys(SHENG).find((k) => SHENG[k] === me)];

  /* ---- 大运：阳年男顺、阴年男逆；阳年女逆、阴年女顺 ---- */
  const birthMs = Date.UTC(y, m - 1, d) + (minuteOfDay - 480) * 60000;
  const allTerms = [];
  for (const yy of [y - 1, y, y + 1]) {
    const row = JIEQI[yy];
    if (!row) continue;
    for (const [name, iso] of Object.entries(row)) allTerms.push({ name, ms: Date.parse(iso) });
  }
  allTerms.sort((a, b) => a.ms - b.ms);
  const prevTerm = allTerms.filter((t) => t.ms <= birthMs).pop();
  const nextTerm = allTerms.find((t) => t.ms > birthMs);

  const yangYear = yGanIdx % 2 === 0;
  const forward = yangYear === (gender === 'male');
  const distDays = forward ? (nextTerm.ms - birthMs) / 86400000 : (birthMs - prevTerm.ms) / 86400000;
  const totalMonths = Math.max(0, Math.round(distDays * 4)); // 3 日 = 1 年 = 12 月
  const startYears = Math.floor(totalMonths / 12);
  const startMonths = totalMonths % 12;
  const startAge = startYears + startMonths / 12;

  const sexIdx = (g, z) => {
    for (let i = 0; i < 60; i++) if (i % 10 === g && i % 12 === z) return i;
    return 0;
  };
  const monthIdx = sexIdx(mGanIdx, mZhiIdx);
  const cycles = Array.from({ length: 8 }, (_, i) => {
    const idx = (monthIdx + (forward ? i + 1 : -(i + 1)) + 600) % 60;
    const g = GAN[idx % 10];
    const age = startAge + i * 10;
    return {
      gan: g, zhi: ZHI[idx % 12],
      startAge: Number(age.toFixed(1)),
      startLabel: `${startYears + i * 10}岁${startMonths ? startMonths + '个月' : ''}`,
      startYear: Math.round(bYear + age),
      tenGod: shishen(day.gan, g),
    };
  });

  const now = new Date();
  const nowYear = yearOf(now.getFullYear(), now.getMonth() + 1, now.getDate(), 12);
  let age = nowYear - bYear;
  if (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) age -= 1;
  const cur = cycles.find((c) => age >= c.startAge && age < c.startAge + 10) || cycles[cycles.length - 1];
  const lnIdx = ((nowYear - 4) % 60 + 60) % 60;
  const liunian = {
    year: nowYear,
    ganZhi: GAN[lnIdx % 10] + ZHI[lnIdx % 12],
    gan: GAN[lnIdx % 10],
    tenGod: shishen(day.gan, GAN[lnIdx % 10]),
    age,
    cycle: `${cur.gan}${cur.zhi}`,
  };

  const startDate = new Date(Date.UTC(y, m - 1, d) + Math.round(startAge * 365.2425) * 86400000)
    .toISOString().slice(0, 10);

  const spread = Math.max(...elems.map((x) => x.v)) - Math.min(...elems.map((x) => x.v));
  const mingScore = Math.round(clamp(60 + spread * 0.25 + (strong ? 0 : 4), 55, 88));

  const luckText = `起运${startYears}岁${startMonths ? `${startMonths}个月` : ''}，${forward ? '顺' : '逆'}行；现行${cur.gan}${cur.zhi}运，${nowYear}年流年${liunian.ganZhi}。`;

  return {
    type: 'ming',
    date, hour: effectiveHour, gender,
    resolved,
    conventions: {
      yearBoundary: 'lichun',
      hourBoundary: 'day_changes_at_23',
      trueSolarApplied: resolved.trueSolarApplied,
      hourAssumed: resolved.hourAssumed,
    },
    notes,
    pillars,
    tenGods,
    deep,
    dayMaster: day.gan,
    dayMasterElem: me,
    elems,
    dom, weak,
    strong,
    yong,
    overall: mingScore,
    fortune: fortuneSheet(yong, dom),
    luck: {
      forward,
      startAge: { years: startYears, months: startMonths },
      startDate,
      cycles,
      liunian,
    },
    summary: `${pillars.map((p) => p.gan + p.zhi).join(' ')}，日主${day.gan}${me}，生于${ZHI[mZhiIdx]}月，${strong ? '身旺' : '身弱'}，${elems.map((x) => x.e + x.v).join(' ')}。${luckText}`,
  };
}

function dayInfo(y, m, d) {
  const day = dayGanzhi(y, m, d);
  const mZhi = monthZhiOf(y, m, d);
  const idx = ((ZHI.indexOf(day.zhi) - mZhi) % 12 + 12) % 12;
  const jc = JIANCHU[idx];
  const chong = ZHI[(ZHI.indexOf(day.zhi) + 6) % 12];
  const sha = SHA.find((s) => s.zhi.includes(day.zhi))?.dir || '—';
  return { day, mZhi, jc, chong, sha };
}

function zeri({ date, event, days = 30, birthYear, from }) {
  const ev = EVENTS.find((e) => e.id === event) || EVENTS.find((e) => e.name === event);

  /* 单日查询 */
  if (!ev) {
    const [y, m, d] = String(date).split('-').map(Number);
    const info = dayInfo(y, m, d);
    return {
      type: 'ze',
      date,
      ganzhi: info.day.gan + info.day.zhi,
      monthZhi: ZHI[info.mZhi],
      jianchu: info.jc,
      chong: info.chong,
      sha: info.sha,
      summary: `${y}年${m}月${d}日，${info.day.gan}${info.day.zhi}日，${ZHI[info.mZhi]}月${info.jc.name}日（${info.jc.luck}）。冲${info.chong}，煞${info.sha}。`,
    };
  }

  const start = from ? new Date(`${from}T00:00:00Z`) : new Date();
  const base = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth(), start.getUTCDate()));
  const span = Math.min(120, Math.max(7, Number(days) || 30));
  const birthZhi = birthYear ? ZHI[((Number(birthYear) - 4) % 12 + 12) % 12] : null;

  const all = [];
  for (let i = 0; i < span; i++) {
    const dt = new Date(base.getTime() + i * 86400000);
    const [y, m, d] = ymd(dt).split('-').map(Number);
    const info = dayInfo(y, m, d);
    const { jc } = info;

    let score = jc.luck === '吉' ? 3 : jc.luck === '凶' ? -4 : 0;
    const hitYi = ev.keys.filter((k) => jc.yi.includes(k));
    const hitJi = ev.keys.filter((k) => jc.ji.includes(k));
    score += hitYi.length * 4;
    score -= hitJi.length * 5;

    const chongMe = birthZhi && info.chong === birthZhi;
    if (chongMe) score -= 6;

    const reasons = [];
    if (jc.luck === '吉') reasons.push(`${jc.name}日，属吉`);
    if (jc.luck === '凶') reasons.push(`${jc.name}日，不宜`);
    if (hitYi.length) reasons.push(`宜${hitYi.join('、')}`);
    if (hitJi.length) reasons.push(`忌${hitJi.join('、')}`);
    if (chongMe) reasons.push(`冲本命${birthZhi}`);

    all.push({
      date: ymd(dt),
      weekday: '日一二三四五六'[dt.getUTCDay()],
      ganzhi: info.day.gan + info.day.zhi,
      jianchu: jc.name,
      luck: jc.luck,
      chong: info.chong,
      sha: info.sha,
      yi: jc.yi,
      ji: jc.ji,
      score,
      reasons,
    });
  }

  const picks = all.filter((x) => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 6);
  const zeriScore = Math.round(clamp(58 + Math.max(0, picks[0]?.score || 0) * 3, 50, 90));
  const avoid = all.filter((x) => x.score <= -4).sort((a, b) => a.score - b.score).slice(0, 5);

  return {
    type: 'ze',
    event: { id: ev.id, name: ev.name },
    from: ymd(base),
    to: ymd(new Date(base.getTime() + (span - 1) * 86400000)),
    days: span,
    overall: zeriScore,
    birthYear: birthYear || null,
    picks,
    avoid,
    summary: `按「${ev.name}」看未来 ${span} 天：${picks.length ? `建议 ${picks.slice(0, 3).map((x) => `${x.date.slice(5)}（${x.jianchu}）`).join('、')} 等 ${picks.length} 个日子` : '没有明显合适的日子'}；避开 ${avoid.length ? avoid.map((x) => x.date.slice(5)).join('、') : '无特别忌日'}。`,
    advice: [
      picks.length ? '优先看排在前面的日子，再看当天是否有冲本命、冲主事人。' : '这个区间没有高分日，建议放宽到 60 天，或改看时辰。',
      '建除只论日辰，不代替对具体事项的判断；婚丧嫁娶等大事请结合双方家庭与实际情况。',
      '若已知主事人生肖，填出生年可自动避开冲本命的日子。',
    ],
  };
}

/* ---------------- 八宅（复用原引擎） ---------------- */
function bazhai(input) {
  const r = buildCompass(input);
  return {
    type: 'kan',
    ...r,
    summary: r.summary,
  };
}

/* ---------------- 阳宅：宅向 + 门 / 床 / 灶 / 书桌 ---------------- */
const GOOD = ['生气', '天医', '延年', '伏位'];
const PLACES = [
  { key: 'door', name: '大门', basis: '宅卦', note: '宅以门为气口，门的吉凶先于家具。' },
  { key: 'stove', name: '灶', basis: '宅卦', note: '灶为养命之源，宜压在凶方、面向吉方。' },
  { key: 'bed', name: '床', basis: '命卦', note: '床是一身之根，按命卦取吉方，不按宅卦。' },
  { key: 'desk', name: '书桌', basis: '命卦', note: '书桌看长坐的位置，宜向命卦吉方。' },
];

function yangzhai({ heading, birthYear, gender, door, bed, stove, desk }) {
  const base = buildCompass({ heading, birthYear, gender, door });
  const houseMap = BAZHAI[base.meta.houseGua];
  const mingMap = BAZHAI[base.meta.mGua];
  const picked = { door, bed, stove, desk };

  const items = PLACES.filter((p) => picked[p.key]).map((p) => {
    const map = p.basis === '命卦' ? mingMap : houseMap;
    const star = map[picked[p.key]];
    return {
      key: p.key, name: p.name, basis: p.basis, note: p.note,
      dir: GUAS[picked[p.key]].dir,
      gua: picked[p.key],
      star: star.name, level: star.level, good: star.good, line: star.line, use: star.use,
    };
  });

  const goodCount = items.filter((i) => i.good).length;
  const badCount = items.length - goodCount;

  const mingGood = ['生气', '天医', '延年']
    .map((s) => ({ s, gua: Object.keys(mingMap).find((g) => mingMap[g].name === s) }))
    .map((x) => ({ ...x, dir: GUAS[x.gua].dir }));

  const advice = [
    `床头宜朝${mingGood[0].dir}（生气）或${mingGood[1].dir}（天医），这两个方位按你的命卦算，不按宅卦。`,
    base.meta.match
      ? '命宅同组，格局本来就顺；先处理采光、通风、动线，再谈方位。'
      : '命宅不同组，不必改门；把床、书桌、常坐的位置挪到命卦吉方即可。',
    badCount ? `有 ${badCount} 处落在凶方：${items.filter((i) => !i.good).map((i) => i.name + '（' + i.star + '）').join('、')}，能挪则挪，挪不动就用柜体、帘子做隔断，别在那里久卧久坐。` : '门、床、灶、桌四处都在吉方，剩下的就是把光、风、水处理好。',
  ];

  return {
    type: 'kan',
    title: '阳宅批注',
    heading: '阳宅',
    glyph: '宅',
    overall: Math.round(clamp(62 + goodCount * 6 - badCount * 4 + (base.meta.match ? 4 : 0), 45, 92)),
    summary: `${base.summary}${items.length ? `已看 ${items.length} 处：${items.map((i) => i.name + '在' + i.dir + '（' + i.star + '）').join('，')}。` : ''}`,
    meta: base.meta,
    items,
    mingGood,
    table: base.table,
    advice,
    cautions: items.filter((i) => !i.good).map((i) => `${i.name}在${i.dir}方，为${i.star}（${i.level}）：${i.line}。`),
    strengths: items.filter((i) => i.good).map((i) => `${i.name}在${i.dir}方，为${i.star}（${i.level}）：${i.line}。`),
    traits: [base.meta.houseGroup, base.meta.mingGroup],
  };
}

/* ---------------- 阴宅：坐向 + 来去水 + 形势 ---------------- */
const SANHE = {
  水: { zhi: ['申', '子', '辰'], sheng: '申' },
  火: { zhi: ['寅', '午', '戌'], sheng: '寅' },
  金: { zhi: ['巳', '酉', '丑'], sheng: '巳' },
  木: { zhi: ['亥', '卯', '未'], sheng: '亥' },
};
const TWELVE = ['长生', '沐浴', '冠带', '临官', '帝旺', '衰', '病', '死', '墓', '绝', '胎', '养'];
const WATER_GOOD_IN = ['长生', '冠带', '临官', '帝旺'];
const WATER_GOOD_OUT = ['衰', '病', '死', '墓', '绝'];

function juOf(zhi) {
  const k = Object.keys(SANHE).find((j) => SANHE[j].zhi.includes(zhi));
  return k ? { ju: k, sheng: SANHE[k].sheng } : { ju: '水', sheng: '申' };
}

function waterState(zhi, sheng) {
  return TWELVE[(ZHI.indexOf(zhi) - ZHI.indexOf(sheng) + 12) % 12];
}

function yinzha({ heading, laishui, qushui, backing = true, mingtang = true, shaq = true }) {
  const facing = mountainAt(heading);
  const sitting = mountainAt(heading + 180);
  const { ju, sheng } = juOf(sitting.zhi);
  const sitState = waterState(sitting.zhi, sheng);

  const inState = laishui ? waterState(laishui, sheng) : null;
  const outState = qushui ? waterState(qushui, sheng) : null;

  const inGood = inState ? WATER_GOOD_IN.includes(inState) : null;
  const outGood = outState ? WATER_GOOD_OUT.includes(outState) : null;

  let score = 60;
  if (inGood) score += 12; else if (inState) score -= 6;
  if (outGood) score += 12; else if (outState) score -= 8;
  if (backing) score += 6;
  if (mingtang) score += 5;
  if (shaq) score += 4;

  const advice = [
    `坐${sitting.n}向${facing.n}，属${ju}局，长生在${sheng}。来水宜自${WATER_GOOD_IN.join('、')}方来，去水宜从${WATER_GOOD_OUT.join('、')}方消。`,
    backing ? '后有靠山，气有所止；再看靠山是否破碎、是否逼压。' : '后无靠，气易散。若无天然靠山，可用围墙、密植或后高前低的格局补。',
    mingtang ? '前有明堂，宜平整开阔，不宜堆土、高树、乱石塞心。' : '前无明堂，气不聚，宜清出前方空间，至少不使门前局促。',
    shaq ? '两侧有砂，能藏风；注意左右是否反背、是否高压逼穴。' : '两侧无砂，风直来直去，宜借地形或植树挡风。',
    '以上为三合水法的简化判断，只论方位与形势，不替代实地踏勘。',
  ];

  const summary = `坐${sitting.n}向${facing.n}（${sitting.n}山${facing.n}向），属${ju}局，长生在${sheng}。`
    + (inState ? `来水在${laishui}，为${inState}，${inGood ? '合局' : '不理想'}。` : '')
    + (outState ? `去水在${qushui}，为${outState}，${outGood ? '合局' : '不理想'}。` : '')
    + `形势：${[backing ? '有靠' : '无靠', mingtang ? '有明堂' : '无明堂', shaq ? '有砂' : '无砂'].join('，')}。`;

  return {
    type: 'kan',
    title: '阴宅批注',
    heading: '阴宅',
    glyph: '穴',
    overall: Math.round(clamp(score, 45, 92)),
    summary,
    meta: { heading: Math.round(((heading % 360) + 360) % 360), facing, sitting },
    ju, sheng, sitState,
    water: { laishui, inState, inGood, qushui, outState, outGood },
    advice,
    cautions: [
      ...(inState && !inGood ? [`来水在${laishui}为${inState}，来水不宜从${inState}方入。`] : []),
      ...(outState && !outGood ? [`去水在${qushui}为${outState}，去水不宜从${outState}方出。`] : []),
      ...(!backing ? ['后无靠，气散。'] : []),
    ],
    strengths: [
      `坐${sitting.zhi}属${ju}局，长生在${sheng}。`,
      ...(inGood ? [`来水${inState}，合长生水法。`] : []),
      ...(outGood ? [`去水${outState}，合墓绝消水。`] : []),
    ],
    traits: [`${ju}局`, `${sitting.n}山${facing.n}向`],
  };
}

/* ---------------- 流日 ---------------- */
function daily({ birth = {}, days = 7, from } = {}) {
  const chart = paipan(birth);
  const n = Math.min(14, Math.max(1, Number(days) || 7));
  const start = from ? new Date(`${from}T00:00:00+08:00`) : new Date();
  const out = [];
  for (let i = 0; i < n; i++) {
    const d = new Date(start.getTime() + i * 86400000);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    const dd = d.getDate();
    const gz = dayGanzhi(y, m, dd);
    const rel = dayRelations(gz.gan, gz.zhi, chart.pillars);
    const god = shishen(chart.dayMaster, gz.gan);
    const adv = dayAdvice(rel, god);
    out.push({
      date: `${y}-${String(m).padStart(2, '0')}-${String(dd).padStart(2, '0')}`,
      ganzhi: gz.gan + gz.zhi,
      tenGod: god,
      relations: rel,
      energy: dayEnergy(rel),
      do: adv.do,
      avoid: adv.avoid,
    });
  }
  const avg = Math.round(out.reduce((a, x) => a + x.energy, 0) / out.length);
  return {
    type: 'daily',
    natal: chart.pillars.map((p) => p.gan + p.zhi),
    dayMaster: chart.dayMaster,
    days: out,
    overall: avg,
    summary: `未来 ${n} 天，按 ${chart.dayMaster} 日主看：${out.map((x) => x.date.slice(5) + ' ' + x.ganzhi).join('、')}。`,
  };
}

/* ---------------- 合盘 ---------------- */
function hepan({ a = {}, b = {} }) {
  const A = paipan(a);
  const B = paipan(b);
  const rel = [];
  let score = 60;

  if (isStemHe(A.dayMaster, B.dayMaster)) { score += 12; rel.push({ type: '干合', text: `${A.dayMaster} 与 ${B.dayMaster} 相合` }); }
  if (isHe(A.pillars[2].zhi, B.pillars[2].zhi)) { score += 12; rel.push({ type: '支合', text: `夫妻宫 ${A.pillars[2].zhi} 与 ${B.pillars[2].zhi} 相合` }); }
  if (isClash(A.pillars[2].zhi, B.pillars[2].zhi)) { score -= 15; rel.push({ type: '支冲', text: `夫妻宫 ${A.pillars[2].zhi} 与 ${B.pillars[2].zhi} 相冲` }); }

  const topA = [...A.elems].sort((x, y) => y.v - x.v)[0].e;
  const topB = [...B.elems].sort((x, y) => y.v - x.v)[0].e;
  if (A.yong.includes(topB)) { score += 8; rel.push({ type: '五行', text: `对方以 ${topB} 为主，正是你的喜用` }); }
  if (B.yong.includes(topA)) { score += 8; rel.push({ type: '五行', text: `你以 ${topA} 为主，正是对方的喜用` }); }
  score = clamp(score, 20, 96);

  return {
    type: 'hepan',
    a: { pillars: A.pillars, dayMaster: A.dayMaster, yong: A.yong, elems: A.elems },
    b: { pillars: B.pillars, dayMaster: B.dayMaster, yong: B.yong, elems: B.elems },
    relations: rel,
    overall: score,
    summary: rel.length
      ? `${rel.map((r) => r.text).join('；')}。`
      : '两人日柱无直接冲合，按五行互补来看。',
  };
}

const TOOLS = {

  daily,
  hepan,
};

return { GAN, ZHI, termsOf, paipan, LIUREN, xiaoliuren, zeri, bazhai, yangzhai, yinzha, daily, hepan, TOOLS, TOOL_MANIFEST };
