        btn.disabled = true;
        btn.textContent = '合 盘 中';
        try {
          const a = { date: aDate, hour: $('[data-a-hour]', root).value, gender: $('[data-a-g]', root).value };
          const b = { date: bDate, hour: $('[data-b-hour]', root).value, gender: $('[data-b-g]', root).value };
          const r = await api.tool('hepan', { a, b });
          const pa = r.a.pillars.map((x) => x.gan + x.zhi).join(' ');
          const pb = r.b.pillars.map((x) => x.gan + x.zhi).join(' ');
          finish(r, {
            title: '合盘批注',
            heading: '合盘',
            glyph: '合',
            subtitle: `${pa}　×　${pb}`,
            overall: r.overall,
            level: levelOf(r.overall),
            blocks: [
              { kind: 'table', title: '双方四柱', head: ['', '第一个', '第二个'], rows: [
                ['四柱', pa, pb],
                ['日主', r.a.dayMaster, r.b.dayMaster],
                ['喜用', r.a.yong.filter(Boolean).join('、'), r.b.yong.filter(Boolean).join('、')],
              ] },
              { kind: 'kv', title: '关系', rows: r.relations.length ? r.relations.map((x) => [x.type, x.text]) : [['日柱', '无直接冲合']] },
            ],
            advice: [
              r.overall >= 70 ? '两人五行互补较多，遇事商量着来，别把默契当理所当然。' : '互补不算多，反而要留出各自的空间，少替对方做决定。',
              '日柱相冲不代表不能处，代表节奏不同：一个快一个慢，先说清楚再动。',
              '合盘只论日柱与五行，不涉及双方家庭、价值观与现实条件。',
            ],
          });
        } catch (err) {
          btn.disabled = false;
          btn.textContent = '看 合 盘';
          toast(err.message.includes('fetch') ? '服务未启动' : err.message);
        }
      });
    },
  };
}


/* ===== assets/js/views/yinzha.js ===== */







const ZHI12 = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];

function yinzhaView() {
  let heading = 0;

  return {
    html: `
      <div class="flow">
        <header class="page-head">
          <a class="back" href="#/" data-back><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>返回</a>
          <h1>阴宅</h1>
          <a class="tb-link right" href="#/about">关于</a>
        </header>

        <p class="lead">拖动罗盘定坐向，选来水、去水方向，再勾选能确认的形势。</p>

        <h2 class="step"><b>一</b>定坐向</h2>
        <div class="compass-stage" data-stage>
          ${compassSVG(MOUNTAINS, GUAS)}
        </div>

        <div class="cp-read">
          <div class="deg" data-readout>朝向 0° · 坎卦 · 北</div>
          <div class="dir" data-dir>坐 <span>子</span> 向 午</div>
          <div class="hint" data-hint>拖动转盘定坐向，松手即定</div>
        </div>

        <div class="cp-actions">
          <button class="btn btn-ghost btn-sm" type="button" data-sensor>启用指南针</button>
          <button class="btn btn-ghost btn-sm" type="button" data-loc>取当前位置</button>
        </div>
        <div class="cp-read"><div class="hint" data-loc-text></div></div>

        <h2 class="step"><b>二</b>水从哪来、往哪去</h2>
        <div class="field">
          <label for="ylai">来水方位（可不填）</label>
          <select class="input" id="ylai" data-lai>
            <option value="">不填</option>
            ${ZHI12.map((z) => `<option value="${z}">${z}</option>`).join('')}
          </select>
        </div>

        <div class="field">
          <label for="yqu">去水方位（可不填）</label>
          <select class="input" id="yqu" data-qu>
            <option value="">不填</option>
            ${ZHI12.map((z) => `<option value="${z}">${z}</option>`).join('')}
          </select>
        </div>

        <h2 class="step"><b>三</b>看形势（能确认就勾）</h2>
        <div class="field">
          <label>这三样，确认了再勾</label>
          <div class="opts">
            <button class="opt" type="button" data-t="backing" aria-pressed="false">后有靠山</button>
            <button class="opt" type="button" data-t="mingtang" aria-pressed="false">前有明堂</button>
            <button class="opt" type="button" data-t="shaq" aria-pressed="false">左右有砂</button>
          </div>
        </div>

        <p class="foot">简化三合水法，只论方位与形势，不替代实地踏勘。</p>
      </div>

      <div class="dock">
        <div class="dock-info"><b data-deg>0°</b>坐向</div>
        <button class="btn btn-primary" type="button" data-go>定 穴</button>
      </div>`,
    mount: () => {
      const root = $('#app .view');
      const stage = $('[data-stage]', root);
      const needle = $('#cpNeedle', root);
      const readout = $('[data-readout]', root);
      const dirEl = $('[data-dir]', root);
      const degEl = $('[data-deg]', root);
      const hint = $('[data-hint]', root);
      const btn = $('[data-go]', root);

      let lai = '';
      let qu = '';
      let loc = null;
      let stopSensor = null;
      const t = { backing: false, mingtang: false, shaq: false };

      const cleanup = () => {
        if (stopSensor) {
          stopSensor();
          stopSensor = null;
        }
      };
      window.addEventListener('hashchange', cleanup, { once: true });

      const paint = () => {
        const facing = mountainAt(heading);
        const sitting = mountainAt(heading + 180);
        needle.setAttribute('transform', `rotate(${norm360(heading).toFixed(1)} 160 160)`);
        readout.textContent = `朝向 ${Math.round(norm360(heading))}° · ${facing.gua}卦 · ${GUAS[facing.gua].dir}`;
        dirEl.innerHTML = `坐 <span>${sitting.n}</span> 向 ${facing.n}`;
        degEl.textContent = `${Math.round(norm360(heading))}°`;
        $$('.cp-shan', root).forEach((el) => {
          const d = Number(el.dataset.deg);
          el.classList.toggle('hot', d === facing.deg || d === sitting.deg);
        });
      };

      const angleAt = (e) => {
        const r = stage.getBoundingClientRect();
        const x = e.clientX - (r.left + r.width / 2);
        const y = e.clientY - (r.top + r.height / 2);
        return (Math.atan2(x, -y) * 180) / Math.PI;
      };
      let dragging = false;
      let startAngle = 0;
      let startHeading = 0;

      stage.addEventListener('pointerdown', (e) => {
        if (stopSensor) return;
        dragging = true;
        startAngle = angleAt(e);
        startHeading = heading;
        stage.setPointerCapture?.(e.pointerId);
        hint.textContent = '转到想要的坐向，松手即定';
      });
      stage.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        heading = startHeading + (angleAt(e) - startAngle);
        paint();
      });
      const stop = () => {
        if (!dragging) return;
        dragging = false;
        heading = Math.round(norm360(heading));
        paint();
        hint.textContent = `已定：坐 ${mountainAt(heading + 180).n} 向 ${mountainAt(heading).n}`;
      };
      stage.addEventListener('pointerup', stop);
      stage.addEventListener('pointercancel', stop);

      paint();

      $('[data-lai]', root)?.addEventListener('change', (e) => { lai = e.target.value; });
      $('[data-qu]', root)?.addEventListener('change', (e) => { qu = e.target.value; });

      const sensorBtn = $('[data-sensor]', root);
      sensorBtn?.addEventListener('click', async () => {
        if (stopSensor) {
          cleanup();
          sensorBtn.textContent = '启用指南针';
          hint.textContent = '已关闭传感器，可拖动转盘';
          return;
        }
        try {
          stopSensor = await startHeading((h) => {
            heading = h;
            paint();
          });
          sensorBtn.textContent = '关闭指南针';
          hint.textContent = '转动手机对准朝向';
        } catch (err) {
          toast(`${err.message}（需 https 或 localhost）`);
        }
      });

      const locBtn = $('[data-loc]', root);
      locBtn?.addEventListener('click', async () => {
        locBtn.disabled = true;
        locBtn.textContent = '定位中…';
        try {
          loc = await locate();
          $('[data-loc-text]', root).textContent = `位置 ${fmtLoc(loc)}`;
        } catch (err) {
          toast(`${err.message}（需 https 或 localhost）`);
        } finally {
          locBtn.disabled = false;
          locBtn.textContent = '取当前位置';
        }
      });

      root.addEventListener('click', (e) => {
        const l = e.target.closest('[data-lai-z]');
        if (l) {
          lai = lai === l.dataset.laiZ ? '' : l.dataset.laiZ;
          root.querySelectorAll('[data-lai-z]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.laiZ === lai)));
          return;
        }
        const q = e.target.closest('[data-qu-z]');
        if (q) {
          qu = qu === q.dataset.quZ ? '' : q.dataset.quZ;
          root.querySelectorAll('[data-qu-z]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.quZ === qu)));
          return;
        }
        const tg = e.target.closest('[data-t]');
        if (tg) {
          const k = tg.dataset.t;
          t[k] = !t[k];
          tg.setAttribute('aria-pressed', String(t[k]));
          return;
        }
        if (e.target.closest('[data-go]')) submit();
      });

      const submit = async () => {
        btn.disabled = true;
        btn.textContent = '定 穴 中';
        try {
          const r = await api.tool('yinzha', {
            heading,
            laishui: lai || undefined,
            qushui: qu || undefined,
            backing: t.backing,
            mingtang: t.mingtang,
            shaq: t.shaq,
          });
          finish(r, {
            title: '阴宅批注',
            heading: '阴宅',
            glyph: '穴',
            subtitle: `${r.meta.sitting.n}山${r.meta.facing.n}向 · ${r.ju}局`,
            blocks: [
              { kind: 'kv', title: '坐向', rows: [
                ['坐山', `${r.meta.sitting.n}（${r.meta.sitting.zhi}）`],
                ['朝向', `${r.meta.facing.n}`],
                ['三合局', `${r.ju}局`],
                ['长生', `${r.sheng}方`],
              ] },
              { kind: 'kv', title: '来去水', rows: [
                ['来水', r.water.inState ? `${r.water.laishui}　${r.water.inState}（${r.water.inGood ? '合' : '不合'}）` : '未填'],
                ['去水', r.water.outState ? `${r.water.qushui}　${r.water.outState}（${r.water.outGood ? '合' : '不合'}）` : '未填'],
              ] },
              { kind: 'kv', title: '形势', rows: [
                ['靠山', t.backing ? '有' : '无'],
                ['明堂', t.mingtang ? '有' : '无'],
                ['砂', t.shaq ? '有' : '无'],
              ] },
              ...(loc ? [{ kind: 'kv', title: '位置', rows: [
                ['经纬度', `${loc.lat}, ${loc.lng}`],
                ['精度', `±${loc.acc}m`],
                ...(loc.alt == null ? [] : [['海拔', `${loc.alt}m`]]),
              ] }] : []),
            ],
            advice: r.advice,
            overall: r.overall,
            level: levelOf(r.overall),
            meta: { location: loc },
          });
        } catch (err) {
          btn.disabled = false;
          btn.textContent = '定 穴';
          toast(err.message.includes('fetch') ? '服务未启动' : err.message);
        }
      };
    },
  };
}


/* ===== assets/js/app.js ===== */
/* ==========================================================================
   app.js — 路由与装配
   ========================================================================== */













const routes = [
  { re: /^#\/?$/, view: homeView, title: '问鹤 · 五门问事' },
  { re: /^#\/c\/(ming|bu|xiang|kan|ze)$/, view: categoryView, title: '门 · 问鹤', params: (m) => [m[1]] },
  { re: /^#\/ming$/, view: mingView, title: '四柱 · 问鹤' },
  { re: /^#\/bu$/, view: buView, title: '起课 · 问鹤' },
  { re: /^#\/ze$/, view: zeView, title: '择日 · 问鹤' },
  { re: /^#\/hepan$/, view: hepanView, title: '合盘 · 问鹤' },
  { re: /^#\/yinzha$/, view: yinzhaView, title: '阴宅 · 问鹤' },
  { re: /^#\/face$/, view: faceView, title: '面相 · 问鹤' },
  { re: /^#\/palm$/, view: palmView, title: '手相 · 问鹤' },
  { re: /^#\/combo$/, view: comboView, title: '综合相 · 问鹤' },
  { re: /^#\/compass$/, view: compassView, title: '罗盘风水 · 问鹤' },
  { re: /^#\/report\/([\w-]+)$/, view: reportView, title: '批注 · 问鹤', params: (m) => [m[1]] },
  { re: /^#\/history$/, view: historyView, title: '批注簿 · 问鹤' },
  { re: /^#\/about$/, view: aboutView, title: '关于 · 问鹤' },
];

function notFoundView() {
  return {
    html: `
      <header class="topbar">
        <a class="brand" href="#/">问鹤</a>
        <a class="tb-link" href="#/history">批注簿</a>
      </header>
      <div class="empty">
        <span class="glyph">缺</span>
        这一页没有找到。<br>
        可能是页面还是旧版本，刷新一次再试；<br>
        或者<a href="#/" style="color:var(--brass-hi)">回命盘</a>。
      </div>`,
  };
}

let lastHash = null;
let lastAt = 0;

/* 站内足迹：返回时回到上一级，而不是一律回首页 */
let trail = (() => {
  try {
    const raw = JSON.parse(sessionStorage.getItem('ft.trail') || '[]');
    return Array.isArray(raw) ? raw.filter((x) => typeof x === 'string' && x.startsWith('#/')) : [];
  } catch { return []; }
})();

function remember(hash) {
  if (!hash.startsWith('#/')) return;
  if (trail[trail.length - 1] === hash) return;
  trail.push(hash);
  if (trail.length > 30) trail.shift();
  try { sessionStorage.setItem('ft.trail', JSON.stringify(trail)); } catch { /* 隐私模式 */ }
}

window.__back = (fallback = '#/') => {
  trail.pop();
  const prev = trail[trail.length - 1];
  try { sessionStorage.setItem('ft.trail', JSON.stringify(trail)); } catch { /* ignore */ }
  go(prev || fallback);
};

function renderPage(target) {
  const hash = (typeof target === 'string' && target) ? target : (location.hash || '#/');
  const app = $('#app');
  const now = Date.now();
  // 同一次跳转可能被 hashchange 与兜底逻辑各触发一次，去重
  if (hash === lastHash && now - lastAt < 150) return;
  lastHash = hash;
  lastAt = now;
  remember(hash);


  // 换页时关掉可能残留的弹层，避免遮住新页面
  const layer = $('#layer');
  if (layer && layer.classList.contains('on')) {
    layer.classList.remove('on');
    layer.innerHTML = '';
  }

  let matched = null;
  for (const r of routes) {
    const m = hash.match(r.re);
    if (m) { matched = { route: r, args: r.params ? r.params(m) : [] }; break; }
  }
  if (!matched) {
    if (hash && hash !== '#' && hash !== '#/') {
      console.warn('[fatetell] 未匹配的路由：', hash);
      matched = { route: { view: notFoundView, title: '未找到 · 问鹤' }, args: [] };
    } else {
      matched = { route: routes[0], args: [] };
    }
  }

  const { html, mount: after } = matched.route.view(...matched.args);
  document.title = matched.route.title;
  app.innerHTML = `<div class="view" role="main">${html}</div>`;
  after?.();
  window.scrollTo(0, 0);
  upgradeChoices(app);
  if (store.takeTrimNotice()) toast('批注簿最多存 24 页，最旧的一页已移出', { ms: 4000 });
  installFrame();
  track('view', { path: hash });
}

/* 渲染失败时给出可见提示，不让页面变成一片黑 */
function mount(target) {
  try {
    renderPage(target);
  } catch (err) {
    console.error('[fatetell] 渲染失败', err);
    const app = $('#app');
    if (app) {
      app.innerHTML = `<div class="empty"><span class="glyph">错</span>页面渲染失败：${esc(err.message || String(err))}<br>刷新一次；仍不行就把这句发我。</div>`;
    }
  }
}

/* 给 ui.go() 用：受限面板里 location 不能改，也能跳 */
window.__route = mount;

/* 点击后同步单选状态（视图仍维护 aria-pressed，样式不动） */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[role="radio"]');
  if (!btn) return;
  const g = btn.closest('[role="radiogroup"]');
  if (!g) return;
  g.querySelectorAll('[role="radio"]').forEach((x) => {
    const on = x === btn;
    x.setAttribute('aria-checked', String(on));
    x.tabIndex = on ? 0 : -1;
  });
});

window.addEventListener('hashchange', () => mount());
window.addEventListener('popstate', () => mount());

/* 返回哪一级：按页面层级，不走浏览历史，避免在多个结果页之间来回跳 */
const parentFor = (hash) => {
  const h = String(hash || '');
  const map = {
    '#/ming': '#/', '#/bu': '#/', '#/ze': '#/', '#/hepan': '#/',
    '#/history': '#/', '#/about': '#/', '#/library': '#/',
    '#/combo': '#/c/xiang', '#/face': '#/c/xiang', '#/palm': '#/c/xiang',
    '#/compass': '#/c/kan', '#/yinzha': '#/c/kan',
  };
  if (map[h]) return map[h];
  if (/^#\/c\//.test(h)) return '#/';
  return '#/';
};

/* 自己接管站内跳转：内嵌预览面板常禁用链接默认行为，甚至锁住 location，
   所以不让跳转依赖浏览器，直接按目标 hash 重挂。 */
document.addEventListener('click', (e) => {
  const back = e.target.closest('[data-back]');
  if (back) {
    e.preventDefault();
    const target = back.getAttribute('data-parent') || parentFor(location.hash);
    go(target || back.getAttribute('data-fallback') || '#/');
    return;
  }

  const submit = e.target.closest('[data-go],[data-submit]');
  if (submit) {
    const label = (submit.textContent || '').trim().replace(/\s+/g, '').slice(0, 12);
    track('click', { name: `${location.hash || '#/'} · ${label || '提交'}` });
  }

  const a = e.target.closest('a[href^="#/"]');
  if (!a) return;
  const href = a.getAttribute('href');
  e.preventDefault();

  const label = (a.querySelector('.gate-name')?.textContent || a.querySelector('.method-name')?.textContent || '')
    .trim().replace(/\s+/g, '').slice(0, 24);
  track('click', { name: label ? `入口:${label}` : `链接:${href}` });

  try { location.hash = href; } catch { /* 面板限制时忽略 */ }
  mount(href);
});

if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', () => { mount(); maybeWechatHint(); });
} else {
  mount();
  maybeWechatHint();
}

/* 键盘：Esc 关闭弹层 */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const layer = $('#layer');
    if (layer && layer.classList.contains('on')) {
      layer.classList.remove('on');
      setTimeout(() => { layer.innerHTML = ''; }, 380);
    }
  }
});
</script>
